<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Leads</title>
<meta name="description" content="Construction site lead register for the field team">
<meta name="theme-color" content="#17212B">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Site Leads">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
/* ======================= TOKENS ======================= */
:root{
  --bg:#E6EAED; --surface:#FFFFFF; --surface-2:#F3F5F7; --ink:#17212B; --ink-2:#2B3742;
  --muted:#5A6672; --line:#D2D9DF; --line-2:#E3E8EC;
  --hivis:#FFD400; --hivis-ink:#17212B; --hivis-press:#E6BF00;
  --blue:#1F55C7; --blue-bg:#E4ECFB;
  --red:#C21F1D; --red-bg:#FCE4E3; --amber:#9A5B00; --amber-bg:#FFF0C7; --green:#1E7338; --green-bg:#DFF3E5;
  --elec:#B87700; --elec-bg:#FFF2CF; --cement:#4F5B67; --cement-bg:#E5E9EE;
  --rmc:#0E6E6E; --rmc-bg:#DDF1F0; --bpd:#6B3FA0; --bpd-bg:#EEE6F8;
  --head:#17212B; --head-ink:#F2F5F7; --head-muted:#9AA7B3;
  --r:10px; --r-sm:7px;
  --font:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --font-cond:"Barlow Semi Condensed", "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --surface:#19222B; --surface-2:#1F2933; --ink:#E7ECF0; --ink-2:#C9D2DA;
    --muted:#93A1AE; --line:#2C3843; --line-2:#24303A;
    --blue:#7FA7FF; --blue-bg:#1C2A45;
    --red:#FF7A75; --red-bg:#3A1C1C; --amber:#FFC14D; --amber-bg:#3A2E12; --green:#6FD38C; --green-bg:#173323;
    --elec:#FFC14D; --elec-bg:#3A2E12; --cement:#B9C4CE; --cement-bg:#26313B;
    --rmc:#5ED0C9; --rmc-bg:#133332; --bpd:#C3A2F0; --bpd-bg:#2B2140;
    --head:#0B1015; --head-ink:#E7ECF0; --head-muted:#8796A3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#19222B; --surface-2:#1F2933; --ink:#E7ECF0; --ink-2:#C9D2DA;
  --muted:#93A1AE; --line:#2C3843; --line-2:#24303A;
  --blue:#7FA7FF; --blue-bg:#1C2A45;
  --red:#FF7A75; --red-bg:#3A1C1C; --amber:#FFC14D; --amber-bg:#3A2E12; --green:#6FD38C; --green-bg:#173323;
  --elec:#FFC14D; --elec-bg:#3A2E12; --cement:#B9C4CE; --cement-bg:#26313B;
    --rmc:#5ED0C9; --rmc-bg:#133332; --bpd:#C3A2F0; --bpd-bg:#2B2140;
  --head:#0B1015; --head-ink:#E7ECF0; --head-muted:#8796A3;
  color-scheme: dark;
}

/* ======================= BASE ======================= */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.4; -webkit-tap-highlight-color:transparent; min-height:100vh}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.hidden{display:none !important}
svg.i{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

/* ======================= BUTTONS ======================= */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface); font-weight:600; text-decoration:none; color:var(--ink); white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--hivis); color:var(--hivis-ink); border-color:var(--hivis)}
.btn.primary:active{background:var(--hivis-press)}
.btn.primary:disabled{opacity:.55; cursor:wait}
.btn.ghost{background:transparent; border-color:transparent}
.btn.danger{color:var(--red)}
.btn.small{min-height:36px; padding:0 12px; font-size:15px}
.btn.block{width:100%}
.icon-btn{display:inline-grid; place-items:center; width:44px; height:44px; border-radius:var(--r-sm); border:0; background:transparent; color:inherit; text-decoration:none}
.icon-btn:active{background:rgba(127,127,127,.15)}
.icon-btn.call{color:var(--blue); background:var(--blue-bg); width:40px; height:40px}

/* ======================= HEADER ======================= */
.top{position:sticky; top:0; z-index:20; background:var(--head); color:var(--head-ink); padding:calc(env(safe-area-inset-top) + 6px) 8px 6px 16px; display:flex; align-items:center; gap:8px}
.brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0}
.brand-mark{background:var(--hivis); color:var(--hivis-ink); font-family:var(--font-cond); font-weight:700; font-size:15px; padding:3px 8px; border-radius:4px; letter-spacing:.2px}
.brand-user{color:var(--head-muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top .icon-btn{color:var(--head-ink)}
#btnRefresh.busy svg{animation:sp .8s linear infinite}
.more-wrap{display:flex; justify-content:center; padding:16px 0 4px}
.status-dot{width:8px; height:8px; border-radius:50%; background:#4FBF73; display:inline-block; margin-right:6px}
.status-dot.off{background:#E5A33A}

/* ======================= TOOLBAR ======================= */
.toolbar{padding:12px 16px 4px; display:grid; gap:10px; max-width:1400px; margin:0 auto}
.search{position:relative}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted)}
.search input{width:100%; height:48px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface); padding:0 40px 0 42px; font-size:16px}
.search .clear{position:absolute; right:2px; top:2px; color:var(--muted)}
.tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:3px; gap:2px}
.seg button{display:inline-flex; align-items:center; gap:6px; border:0; background:transparent; height:36px; padding:0 12px; border-radius:5px; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.select{height:42px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--surface); padding:0 10px; font-weight:500; max-width:200px}
.filter-btn{position:relative}
.count-badge{background:var(--ink); color:var(--surface); border-radius:10px; font-size:12px; min-width:20px; height:20px; display:inline-grid; place-items:center; padding:0 6px}
.summary{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:15px}
.summary .total{color:var(--muted); margin-right:4px}
.chip{display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:16px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.chip.red{color:var(--red); background:var(--red-bg); border-color:transparent}
.chip.amber{color:var(--amber); background:var(--amber-bg); border-color:transparent}
.chip.red[aria-pressed="true"]{background:var(--red); color:#fff}
.chip.amber[aria-pressed="true"]{background:var(--amber); color:#fff}
.banner{margin:8px 16px 0; padding:10px 14px; border-radius:var(--r-sm); background:var(--amber-bg); color:var(--amber); font-size:14px; font-weight:500; max-width:1368px}
@media (min-width:1400px){ .banner{margin-left:auto; margin-right:auto} }

/* ======================= CARDS ======================= */
.list-area{padding:8px 16px 120px; max-width:1400px; margin:0 auto}
.cards{display:grid; gap:12px; align-items:start; grid-template-columns:repeat(auto-fill, minmax(min(100%, 340px), 1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 14px 12px; display:flex; flex-direction:column; gap:8px; cursor:pointer; position:relative; min-width:0}
.card:active{background:var(--surface-2)}
.card.archived{opacity:.65}
.card-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.plate{font-family:var(--font-cond); font-weight:700; background:var(--hivis); color:var(--hivis-ink); padding:1px 8px; border-radius:4px; font-size:16px; font-variant-numeric:tabular-nums; box-shadow:inset 0 0 0 1.5px rgba(23,33,43,.85)}
.badge{font-size:13px; font-weight:600; padding:2px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted)}
.badge.elec{background:var(--elec-bg); color:var(--elec)}
.badge.cement{background:var(--cement-bg); color:var(--cement)}
.badge.rmc{background:var(--rmc-bg); color:var(--rmc)}
.badge.status{font-weight:700}
.st-open{background:var(--blue-bg) !important; color:var(--blue) !important}
.st-conv{background:var(--green-bg) !important; color:var(--green) !important}
.st-not{background:var(--red-bg) !important; color:var(--red) !important}
.status-bar{display:flex; gap:8px; flex-wrap:wrap}
.sbtn{display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 14px; border-radius:20px; border:1.5px solid var(--line); background:var(--surface); font-weight:600; font-size:15px; color:var(--ink)}
.sbtn .n{font-variant-numeric:tabular-nums; font-size:13px; min-width:22px; height:22px; border-radius:11px; display:inline-grid; place-items:center; padding:0 6px; background:var(--surface-2); color:var(--muted)}
.sbtn .dot{width:10px; height:10px; border-radius:50%}
.sbtn.st-open-b .dot{background:var(--blue)} .sbtn.st-conv-b .dot{background:var(--green)} .sbtn.st-not-b .dot{background:var(--red)}
.sbtn[aria-pressed="true"].st-open-b{background:var(--blue); border-color:var(--blue); color:var(--surface)}
.sbtn[aria-pressed="true"].st-conv-b{background:var(--green); border-color:var(--green); color:var(--surface)}
.sbtn[aria-pressed="true"].st-not-b{background:var(--red); border-color:var(--red); color:var(--surface)}
.sbtn[aria-pressed="true"] .dot{background:var(--surface)}
@media (max-width:480px){
  .status-bar{flex-wrap:nowrap; gap:5px; overflow-x:auto; scrollbar-width:none; margin:0 -12px; padding:0 12px}
  .status-bar::-webkit-scrollbar{display:none}
  .sbtn{flex:none; padding:0 8px; gap:5px; font-size:14px; min-height:40px}
  .sbtn .n{min-width:20px; padding:0 5px}
  .sbtn .dot{display:none}
}
.sbtn[aria-pressed="true"] .n{background:color-mix(in srgb, var(--surface) 25%, transparent); color:var(--surface)}
.reason{margin:0; font-size:14px; color:var(--red); background:var(--red-bg); border-radius:6px; padding:6px 10px}
.reason b{font-weight:600}
.status-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 14px}
.status-row .lbl{font-size:14px; color:var(--muted); margin-right:2px}
.opt.st-open[aria-pressed="true"]{background:var(--blue) !important; color:var(--surface) !important; border-color:var(--blue)}
.opt.st-conv[aria-pressed="true"]{background:var(--green) !important; color:var(--surface) !important; border-color:var(--green)}
.opt.st-not[aria-pressed="true"]{background:var(--red) !important; color:var(--surface) !important; border-color:var(--red)}
.opt.st-open,.opt.st-conv,.opt.st-not{background:var(--surface) !important; color:var(--ink) !important}
.badge.bpd{background:var(--bpd-bg); color:var(--bpd)}
.badge.arch{background:var(--surface-2); color:var(--muted)}
.badge.danger{background:var(--red-bg); color:var(--red)}
.danger-zone{margin-top:20px; padding-top:16px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.danger-zone .hint{flex-basis:100%; margin:0}
.title-role{font-family:var(--font); font-size:12px; font-weight:600; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:1px 6px; flex:none}
.d-role{display:inline-block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:2px}
.fu{margin-left:auto; font-size:13px; font-weight:600; padding:2px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.fu.overdue{background:var(--red-bg); color:var(--red)}
.fu.today{background:var(--amber-bg); color:var(--amber)}
.fu.soon{background:var(--blue-bg); color:var(--blue)}
.card h3{margin:0; font-family:var(--font-cond); font-size:21px; line-height:1.15; font-weight:700; display:flex; align-items:center; gap:8px}
.card h3 .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis}
.card h3 .muted{color:var(--muted); font-weight:600}
.addr{margin:0; color:var(--muted); font-size:15px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.stage{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; flex-wrap:wrap}
.pips{display:flex; gap:3px}
.pips i{width:12px; height:8px; border-radius:2px; background:var(--line)}
.pips i.on{background:var(--ink)}
.pips.hold i.on{background:var(--amber)}
.proj{font-family:var(--font-cond); padding:1px 7px; border:1px solid var(--line); border-radius:4px; font-size:14px}
.contacts{list-style:none; margin:0; padding:0; display:grid; gap:2px; border-top:1px solid var(--line-2); padding-top:6px}
.contacts li{display:flex; align-items:center; gap:8px; min-height:40px; font-size:15px}
.contacts .role{color:var(--muted); width:84px; flex:none; font-size:14px}
.contacts .who{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500}
.contacts .tag{font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:40%; flex-shrink:1}
.contacts{grid-template-columns:minmax(0,1fr)}
.contacts li{min-width:0}
.contacts li > *{min-width:0}
.card h3 .title-role{margin-left:auto}
.contacts .call{flex:none}
@media (max-width:400px){
  .contacts .role{width:68px; font-size:13px}
  .list-area, .toolbar{padding-left:12px; padding-right:12px}
  .card{padding:12px 12px 10px}
  .kv .r{grid-template-columns:minmax(96px, 36%) 1fr}
}
html, body{overflow-x:clip}
.extra{margin:0; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:14px}
.extra dt{color:var(--muted)}
.extra dd{margin:0; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.card-foot{display:flex; align-items:center; gap:8px; border-top:1px solid var(--line-2); padding-top:8px; font-size:14px; color:var(--muted)}
.card-foot .spacer{flex:1}
.card-foot a.maplink{display:inline-flex; align-items:center; gap:5px; font-weight:600; text-decoration:none; padding:6px 8px; margin-left:-8px; border-radius:6px}
.thumb{width:44px; height:44px; border-radius:6px; object-fit:cover; background:var(--surface-2); border:1px solid var(--line)}

.empty{text-align:center; padding:60px 20px; color:var(--muted)}
.empty h2{font-family:var(--font-cond); color:var(--ink); margin:0 0 6px; font-size:24px}

/* ======================= BIG LIST (table) ======================= */
.list-area.full{max-width:none; padding:4px 16px 0}
.table-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:auto; height:calc(100vh - 230px); min-height:300px; overscroll-behavior:contain}
.table-wrap::after{content:""; display:block; height:76px}
.grid{border-collapse:separate; border-spacing:0; table-layout:fixed; min-width:100%; font-size:15px}
.grid th,.grid td{padding:12px 14px; border-bottom:1px solid var(--line-2); text-align:left; vertical-align:top; white-space:normal; overflow-wrap:break-word; word-break:normal; hyphens:auto; line-height:1.35}
.grid th{position:sticky; top:0; background:var(--surface-2); z-index:2; font-weight:600; font-size:14px; color:var(--ink-2); user-select:none; padding-right:18px}
.grid th button{all:unset; cursor:pointer; display:inline; overflow-wrap:break-word}
.grid th button:focus-visible{outline:3px solid var(--blue)}
.grid th .arrow{color:var(--muted); font-size:11px; margin-left:4px}
.grid .stk{position:sticky; left:0; z-index:1; background:var(--surface)}
.grid .stk2{position:sticky; left:64px; z-index:1; background:var(--surface); box-shadow:1px 0 0 var(--line)}
.grid th.stk,.grid th.stk2{z-index:3; background:var(--surface-2)}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid tbody tr.picked td{background:var(--amber-bg)}
.grid td a{font-weight:600; text-decoration:none}
.grid td .sub{font-size:13px; color:var(--muted); margin-top:2px}
.grid td .badges{display:flex; gap:4px; flex-wrap:wrap}
.grid td .fu{margin:0}
.rz{position:absolute; top:0; right:0; width:14px; height:100%; cursor:col-resize; z-index:4; touch-action:none}
.rz::after{content:""; position:absolute; right:0; top:8px; bottom:8px; width:2px; border-radius:1px; background:var(--line)}
.rz:hover::after,.rz.on::after{background:var(--blue); top:0; bottom:0; width:3px}
@media (pointer:coarse){ .rz{width:22px} }
.card.picked{outline:3px solid var(--hivis); outline-offset:-1px}
.title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.title-row .lbl{font-size:14px; color:var(--muted); font-weight:500}
.seg.small button{height:32px; padding:0 11px; font-size:14px}
@media (max-width:480px){ .title-row{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -12px; padding:0 12px} .title-row::-webkit-scrollbar{display:none} .title-row .seg{flex:none} .title-row .lbl{flex:none} }

/* ======================= FAB ======================= */
.fab{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:15; height:56px; padding:0 22px 0 18px; border-radius:28px; border:2px solid var(--hivis-ink); background:var(--hivis); color:var(--hivis-ink); font-family:var(--font-cond); font-weight:700; font-size:19px; display:inline-flex; align-items:center; gap:8px; box-shadow:0 6px 16px rgba(15,23,30,.28)}
.fab svg.i{width:24px; height:24px; stroke-width:2.6}
.fab:active{background:var(--hivis-press)}
@media (max-height:500px){
  .fab{width:52px; height:52px; padding:0; justify-content:center; font-size:0; gap:0}
  .fab svg.i{width:26px; height:26px}
}

/* ======================= LAYERS (screens) ======================= */
.layer{position:fixed; inset:0; z-index:40; display:flex; justify-content:center; background:rgba(10,15,20,.45); opacity:0; transition:opacity .16s}
.layer.in{opacity:1}
.panel{background:var(--bg); width:100%; max-width:760px; height:100%; display:flex; flex-direction:column; transform:translateY(12px); transition:transform .18s}
.layer.in .panel{transform:none}
@media (min-width:800px){ .panel{height:calc(100% - 48px); margin-top:24px; border-radius:14px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.3)} }
.panel-head{display:flex; align-items:center; gap:6px; padding:calc(env(safe-area-inset-top) + 6px) 8px 6px; background:var(--head); color:var(--head-ink); min-height:58px}
.panel-head .icon-btn{color:var(--head-ink)}
.panel-head h2{flex:1; margin:0; font-family:var(--font-cond); font-size:21px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.panel-body{flex:1; overflow:auto; padding:16px 16px 32px; -webkit-overflow-scrolling:touch}
.panel-foot{display:flex; gap:10px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line)}
.panel-foot .btn{flex:1}
.layer.sheet{align-items:flex-end}
.layer.sheet .panel{height:auto; max-height:88vh; border-radius:16px 16px 0 0; margin:0}
@media (min-width:800px){ .layer.sheet{align-items:center} .layer.sheet .panel{border-radius:14px; max-width:560px} }
.sheet .panel-head{background:var(--surface); color:var(--ink); border-bottom:1px solid var(--line)}
.sheet .panel-head .icon-btn{color:var(--ink)}

/* ======================= DRAWER (opens from the right) ======================= */
.layer.drawer{justify-content:flex-end; align-items:stretch; background:rgba(10,15,20,.28)}
.layer.drawer .panel{max-width:600px; height:100%; margin:0; border-radius:0; transform:translateX(100%); transition:transform .22s ease; box-shadow:-18px 0 44px rgba(0,0,0,.25)}
.layer.drawer.in .panel{transform:none}
@media (min-width:800px){ .layer.drawer .panel{height:100%; margin-top:0; border-radius:0} }
.dhead{display:flex; align-items:flex-start; gap:10px; padding:calc(env(safe-area-inset-top) + 12px) 12px 12px 16px; background:var(--surface); border-bottom:1px solid var(--line)}
.dh-main{flex:1; min-width:0}
.dhead .d-title{font-size:26px; margin:4px 0 2px; overflow-wrap:anywhere}
.dhead .d-addr{margin:0 0 4px; font-size:15px}
.dhead .actions{margin:10px 0 0}
.dhead .d-top{margin:0}
.xbtn{flex:none; width:44px; height:44px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); display:grid; place-items:center}
.xbtn:hover{background:var(--surface-2)}
.drawer .panel-foot{align-items:center}
.drawer .panel-foot .btn{flex:none; min-width:96px}
.drawer .panel-foot .grow{flex:1; min-width:0}
@media (max-width:480px){
  .drawer .panel-foot{gap:8px; padding-left:12px; padding-right:12px}
  .drawer .panel-foot .btn{flex:1 1 auto; min-width:0; padding:0 12px}
  .drawer .panel-foot .grow:empty{display:none}
  .drawer .panel-foot .fmsg{flex:0 1 auto; font-size:13px; max-width:30%}
}
.fmsg{font-size:14px; font-weight:600; color:var(--muted)}
.fmsg.dirty{color:var(--amber)}
.arch-note{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; margin-bottom:12px; font-size:14px}
.arch-note span{flex:1}
fieldset.fs{border:0; margin:0; padding:0; min-width:0}
fieldset.fs[disabled]{opacity:.75}
.pane[hidden]{display:none}

/* Inline editing: values look like text, tap to type */
.inline .sec-b{gap:0; padding:0 14px 6px}
.inline .fld{display:grid; grid-template-columns:minmax(104px, 34%) minmax(0,1fr); column-gap:12px; align-items:start; padding:6px 0; border-bottom:1px solid var(--line-2); position:relative}
.inline .fld:last-child{border-bottom:0}
.inline .fld > .l{margin:0; padding-top:11px; font-weight:500 !important; color:var(--muted); font-size:14px}
.inline .fld > :not(.l){grid-column:2}
.inline .inp{border-color:transparent; background:transparent; min-height:42px; padding:9px 10px; font-size:15px}
.inline textarea.inp{min-height:42px; resize:none; overflow:hidden; line-height:1.4}
.inline .inp:hover{border-color:var(--line); background:var(--surface-2)}
.inline .inp:focus{border-color:var(--blue); background:var(--surface)}
.inline select.inp{border-color:var(--line-2)}
.inline .opts{padding:5px 0}
.inline .opt{min-height:36px; font-size:14px; padding:0 12px}
.inline .gps-box, .inline [data-photos]{margin:6px 0}
.inline .hint{margin:2px 0 4px 10px}
.inline .fld.chg::before{content:""; position:absolute; left:-14px; top:0; bottom:0; width:4px; background:var(--hivis)}
.inline .fld.chg .inp, .inline .fld.chg .opts{background:color-mix(in srgb, var(--hivis) 14%, transparent); border-radius:var(--r-sm)}
.was{font-size:12px; color:var(--amber); margin:2px 0 4px 10px; font-weight:600}
.inrow{display:flex; gap:6px; align-items:center}
.inrow .inp{flex:1; min-width:0}
.onc{display:inline-flex; align-items:center; gap:6px; flex:none; font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; padding:4px 2px; white-space:nowrap}
.onc.on{color:var(--green)}
.sw.sm{width:36px; height:22px}
.sw.sm::after{width:16px; height:16px}
.sw.sm:checked::after{transform:translateX(14px)}
@media (max-width:420px){ .onc{flex-direction:column; gap:2px; font-size:10px} }
@media (max-width:420px){ .inline .fld{grid-template-columns:minmax(92px, 33%) minmax(0,1fr); column-gap:8px} }

/* Arrange panel */
.arows{display:grid; gap:6px}
.arow{display:flex; align-items:center; gap:10px; padding:6px 10px 6px 4px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); min-height:50px}
.arow .nm{flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere}
.arow .nm small{display:block; font-weight:400; color:var(--muted); font-size:12px}
.arow.fixed{background:var(--surface-2)}
.arow.dragging{box-shadow:0 10px 24px rgba(0,0,0,.18); border-color:var(--blue); position:relative; z-index:2}
.hdl{width:40px; height:40px; display:grid; place-items:center; border:0; background:transparent; color:var(--muted); cursor:grab; touch-action:none; border-radius:6px; flex:none}
.hdl:active{cursor:grabbing; background:var(--surface-2)}
.sw{appearance:none; -webkit-appearance:none; width:44px; height:26px; border-radius:13px; background:var(--line); position:relative; flex:none; cursor:pointer; margin:0; transition:background .15s}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .15s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(18px)}
.sw:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.trow{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); margin-bottom:6px; font-weight:600}
.trow span{flex:1}
.lay{display:grid; grid-template-columns:minmax(0,1fr); gap:16px}
.lay h4{font-family:var(--font-cond); font-size:17px; margin:14px 0 6px; color:var(--muted)}
.preview .card{cursor:default}
@media (min-width:1000px){ .layer.drawer.wide .panel{max-width:920px} .wide .lay{grid-template-columns:minmax(0,1fr) 340px} .wide .preview{position:sticky; top:0; align-self:start} }

/* ======================= FORM ======================= */
.sec{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:12px; overflow:hidden}
.sec-h{width:100%; display:flex; align-items:center; gap:10px; padding:14px 16px; border:0; background:transparent; text-align:left}
.sec-h h3{margin:0; flex:1; font-family:var(--font-cond); font-size:19px; font-weight:700}
.sec-h .filled{font-size:13px; color:var(--muted)}
.sec-h .chev{transition:transform .15s; color:var(--muted)}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-b{padding:0 16px 16px; display:grid; gap:14px}
.fld label.l{display:block; font-weight:600; font-size:15px; margin-bottom:6px}
.fld .req{color:var(--red)}
.inp{width:100%; min-height:48px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); padding:10px 12px; font-size:16px}
textarea.inp{min-height:84px; resize:vertical}
.inp:focus{border-color:var(--blue); outline:none; box-shadow:0 0 0 3px var(--blue-bg)}
.hint{font-size:13px; color:var(--muted); margin-top:6px}
.hint.warn{color:var(--amber)}
.hint.err{color:var(--red)}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{min-height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:15px}
.opt[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.row2{display:flex; gap:8px; flex-wrap:wrap}
.gps-box{border:1px dashed var(--line); border-radius:var(--r-sm); padding:12px; display:grid; gap:10px}
.gps-val{font-variant-numeric:tabular-nums; font-weight:600}
.photos{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px}
.ph{position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line)}
.ph img{width:100%; height:100%; object-fit:cover; display:block}
.ph .x{position:absolute; top:4px; right:4px; width:30px; height:30px; border-radius:50%; border:0; background:rgba(0,0,0,.6); color:#fff; display:grid; place-items:center}
.ph .x svg.i{width:16px; height:16px}
.ph .state{position:absolute; inset:auto 0 0 0; background:rgba(0,0,0,.6); color:#fff; font-size:12px; padding:3px 6px; text-align:center}
.ph.fail .state{background:var(--red)}
.add-ph{display:grid; place-items:center; gap:4px; align-content:center; border:2px dashed var(--line); border-radius:8px; aspect-ratio:1; background:transparent; color:var(--ink); font-weight:600; font-size:14px}
.add-ph svg.i{width:26px; height:26px}
.draft-note{display:flex; align-items:center; gap:10px; background:var(--blue-bg); color:var(--blue); border-radius:var(--r-sm); padding:10px 12px; margin-bottom:12px; font-size:14px; font-weight:500}
.draft-note span{flex:1}

/* ======================= DETAIL ======================= */
.d-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.d-title{font-family:var(--font-cond); font-size:28px; line-height:1.1; margin:0 0 4px}
.d-addr{color:var(--muted); margin:0 0 12px}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin:0 0 14px}
.tabs button{border:0; background:transparent; padding:10px 14px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink); border-color:var(--hivis)}
.kv{display:grid; gap:0}
.kv .r{display:grid; grid-template-columns:minmax(110px, 38%) 1fr; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-2); align-items:center}
.kv .r:last-child{border-bottom:0}
.kv .k{color:var(--muted); font-size:14px}
.kv .v{font-weight:500; word-break:break-word; display:flex; align-items:center; gap:8px; flex-wrap:wrap; white-space:pre-wrap}
.kv .v.none{color:var(--muted); font-weight:400}
.map{width:100%; height:200px; border:0; border-radius:8px; display:block; margin-top:6px; background:var(--surface-2)}
.meta{font-size:13px; color:var(--muted); margin:16px 0}
.hist{list-style:none; margin:0; padding:0}
.hist li{padding:12px 0; border-bottom:1px solid var(--line-2)}
.hist .when{font-size:13px; color:var(--muted)}
.hist .what{margin-top:2px}
.hist del{color:var(--red); text-decoration:line-through}
.hist ins{color:var(--green); text-decoration:none; font-weight:600}

/* viewer */
.viewer{background:rgba(0,0,0,.92); align-items:center; justify-content:center; flex-direction:column}
.viewer img{max-width:100%; max-height:80vh; object-fit:contain}
.viewer .vbar{position:absolute; top:calc(env(safe-area-inset-top) + 8px); left:8px; right:8px; display:flex; justify-content:space-between}
.viewer .icon-btn, .viewer a{color:#fff}

/* ======================= IN-APP CAMERA ======================= */
.layer.camera{background:#000; opacity:1; transition:none}
.layer.camera .panel{transform:none; transition:none}
.layer.camera .panel{background:#000; max-width:none; margin:0; height:100%; border-radius:0; box-shadow:none}
.layer.camera .panel-body{padding:0; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center}
.cam-video{width:100%; height:100%; object-fit:contain; background:#000}
.cam-flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s}
.cam-flash.on{opacity:.7; transition:none}
.cam-top{position:absolute; top:calc(env(safe-area-inset-top) + 8px); left:8px; right:8px; display:flex; justify-content:space-between; align-items:center; gap:8px}
.cam-top .icon-btn{color:#fff; background:rgba(0,0,0,.45); border-radius:50%}
.cam-top .btn{background:rgba(0,0,0,.45); color:#fff; border-color:rgba(255,255,255,.35)}
.cam-bar{position:absolute; left:0; right:0; bottom:0; padding:16px 20px calc(20px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; background:linear-gradient(transparent, rgba(0,0,0,.6))}
.cam-count{color:#fff; font-weight:600; font-size:15px}
.cam-done{justify-self:end}
.shutter{width:74px; height:74px; border-radius:50%; border:5px solid #fff; background:rgba(255,255,255,.25); padding:0}
.shutter:active{background:#fff; transform:scale(.94)}
.shutter:disabled{opacity:.4}
.cam-msg{position:absolute; color:#fff; text-align:center; padding:24px; max-width:320px}

/* ======================= SETTINGS ======================= */
.f-group h4{font-family:var(--font-cond); font-size:17px; margin:16px 0 6px; color:var(--muted)}
.f-row{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); margin-bottom:6px}
.f-main{display:flex; align-items:center; gap:4px; padding:4px 4px 4px 12px; min-height:52px}
.f-main .nm{flex:1; min-width:0}
.f-main .nm b{display:block; font-weight:600}
.f-main .nm small{color:var(--muted)}
.f-row.off .nm b{color:var(--muted); text-decoration:line-through}
.f-edit{padding:4px 12px 14px; display:grid; gap:12px; border-top:1px solid var(--line-2)}
.checks{display:flex; flex-wrap:wrap; gap:8px 16px}
.checks label{display:flex; align-items:center; gap:8px; min-height:36px}
.checks input{width:20px; height:20px; accent-color:var(--ink)}
.card-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px}
.card-box h3{font-family:var(--font-cond); margin:0 0 10px; font-size:19px}

/* ======================= LOGIN ======================= */
.login{min-height:100vh; display:flex; flex-direction:column}
.login-top{background:var(--head); color:var(--head-ink); padding:calc(env(safe-area-inset-top) + 48px) 24px 56px}
.login-top .plate-big{display:inline-block; background:var(--hivis); color:var(--hivis-ink); font-family:var(--font-cond); font-weight:700; font-size:34px; padding:4px 14px; border-radius:6px; box-shadow:inset 0 0 0 3px var(--hivis-ink)}
.login-top p{color:var(--head-muted); margin:14px 0 0; max-width:30ch}
.login form{background:var(--surface); margin:-28px 16px 24px; border-radius:14px; padding:20px; display:grid; gap:14px; border:1px solid var(--line); max-width:420px; width:calc(100% - 32px); align-self:center}
.login .err{color:var(--red); font-weight:500; min-height:1em; margin:0}
.login .demo{font-size:14px; background:var(--amber-bg); color:var(--amber); padding:10px 12px; border-radius:8px; margin:0}

/* ======================= MENU / TOAST ======================= */
.menu{position:fixed; z-index:60; top:calc(env(safe-area-inset-top) + 54px); right:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 12px 30px rgba(0,0,0,.2); min-width:230px; padding:6px}
.menu button{display:flex; width:100%; align-items:center; gap:12px; border:0; background:transparent; padding:12px; border-radius:7px; text-align:left; font-weight:500}
.menu button:active,.menu button:hover{background:var(--surface-2)}
.menu hr{border:0; border-top:1px solid var(--line-2); margin:4px 0}
#toast{position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--surface); padding:12px 18px; border-radius:10px; font-weight:500; z-index:100; opacity:0; pointer-events:none; transition:all .2s; max-width:calc(100% - 32px)}
#toast.show{opacity:1; transform:translateX(-50%)}
#toast.err{background:var(--red); color:#fff}
.spin{width:18px; height:18px; border:2.5px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex; align-items:center; gap:10px; justify-content:center; padding:40px; color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layers"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
/* The Google script link lives in config.js (one line, easy to change on GitHub).
   If config.js has no link, the app runs in DEMO mode (data stays on this device). */
const API_URL = String((window.SITE_LEADS_CONFIG && window.SITE_LEADS_CONFIG.API_URL) || '').trim();

const APP_VERSION = "1.2.0";
const BACKEND_VERSION = "1.0.2"; // the Code.gs version this app needs (or newer)
function verLess(a, b) { // true if version a is older than b; a missing version counts as oldest
  const pa = String(a || '0').split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) < (pb[i] || 0); }
  return false;
}
const DEMO = !API_URL;

/* Special columns the app knows about (it still works if you hide them) */
const K = {
  SR: 'Sr. No.', CREATED_AT: 'Created At', CREATED_BY: 'Created By', UPDATED_AT: 'Updated At', UPDATED_BY: 'Updated By', ARCHIVED: 'Archived',
  TITLE: 'Owner Name', TITLE_PHONE: 'Owner Number', ADDR: 'Site Address', TYPE: 'Lead Type', STATUS: 'Site Status',
  PROJECT: 'Project', FOLLOW: 'Follow-up Date', DATE: 'Date',
  CTYPE: 'Contractor Type', BUILDER: 'Builder Name', BUILDER_PHONE: 'Builder Number',
  LSTATUS: 'Lead Status', REASON: 'Not Converted Reason', CARDNAME: 'Card Name'
};
/* Lead Status: new leads start as the first option (Open).
   "Not Converted" needs a reason; for other statuses the reason is cleared. */
const isNotConv = v => /not\s*converted/i.test(String(v || ''));
function statusOptions() { const f = field(K.LSTATUS); return f && f.options.length ? f.options : ['Open', 'Converted', 'Not Converted']; }
const leadStatus = l => l[K.LSTATUS] || statusOptions()[0];
const isOpen = l => leadStatus(l) === statusOptions()[0];
function statusClass(v) { v = String(v || '').toLowerCase(); return isNotConv(v) ? 'st-not' : /convert/.test(v) ? 'st-conv' : 'st-open'; }
const statusBadge = l => `<span class="badge status ${statusClass(leadStatus(l))}">${esc(leadStatus(l))}</span>`;
/* Which person's name is shown as the card title and in the list's Name column.
   Each lead decides with the "On card" toggle next to the names (saved in the
   "Card Name" column). Leads where nothing is chosen show the Builder. */
const PEOPLE = {
  owner: ['Owner Name', 'Owner Number', 'Owner'],
  builder: ['Builder Name', 'Builder Number', 'Builder'],
  architect: ['Architect Name', 'Architect Number', 'Architect'],
  contractor: ['Contractor Name', 'Contractor Number', 'Contractor'],
  electrical: ['Electrical Contractor Name', 'Electrical Contractor Number', 'Electrical Contractor']
};
const DEFAULT_CARD_PERSON = 'Builder';
const NAME_ROLE = Object.fromEntries(Object.values(PEOPLE).map(([n, , r]) => [n, r])); // 'Builder Name' → 'Builder'
function person(l, k) { const [n, p, r] = PEOPLE[k]; return { name: l[n] || '', phone: l[p] || '', role: r, label: n, phoneLabel: p }; }
function cardRole(v) { const r = String(v || '').trim(); return Object.values(PEOPLE).some(x => x[2] === r) ? r : DEFAULT_CARD_PERSON; }
function leadTitle(l) {
  const role = cardRole(l[K.CARDNAME]);
  const k = Object.keys(PEOPLE).find(k => PEOPLE[k][2] === role);
  return person(l, k);
}

/* Personal view settings (column order/width/visibility, card layout, title).
   Saved only in this browser for this person, never in the Google Sheet. */
const CARD_DEFAULTS = { sub: 'Site Address', status: true, type: true, follow: true, project: false, vendor: false, ctype: false, stage: true, contacts: true, extras: true, foot: true };
function prefKey() { return 'sl_prefs_' + String(S.user ? S.user.name : '').toLowerCase(); }
function prefs() {
  if (!S.prefs) {
    const saved = store.get(prefKey()) || {};
    S.prefs = { cols: Array.isArray(saved.cols) ? saved.cols : null, card: Object.assign({}, CARD_DEFAULTS, saved.card || {}) };
  }
  return S.prefs;
}
function savePrefs() { store.set(prefKey(), S.prefs); }
const colLabel = k => k === '__name' ? 'Name' : k === '__updated' ? 'Updated' : k === '__by' ? 'Updated by' : k;
function defaultWidth(k) {
  if (k === '__name') return 210; if (k === '__updated') return 150; if (k === '__by') return 120;
  const f = field(k);
  return ({ phone: 150, date: 120, longtext: 260, multiselect: 180, picklist: 140, picklist_custom: 160, gps: 90, photos: 110, number: 110 })[f ? f.type : 'text'] || 170;
}
// The list columns in this person's order; new columns from Settings slot in automatically
function colsList(P = prefs()) {
  const all = ['__name', ...F_().filter(f => f.label !== K.CARDNAME).map(f => f.label), '__updated', '__by'];
  const out = (P.cols || []).filter(c => all.includes(c.key)).map(c => ({ key: c.key, show: c.show !== false, w: Math.max(70, +c.w || defaultWidth(c.key)) }));
  all.forEach((k, i) => {
    if (out.some(o => o.key === k)) return;
    const f = field(k);
    const c = { key: k, show: k.startsWith('__') ? true : !!(f && f.list), w: defaultWidth(k) };
    const prev = all.slice(0, i).reverse().find(x => out.some(o => o.key === x));
    out.splice(prev ? out.findIndex(o => o.key === prev) + 1 : 0, 0, c);
  });
  return out;
}
const hasChoices = type => type === 'picklist' || type === 'picklist_custom' || type === 'multiselect';
const multi = v => String(v || '').split(',').map(s => s.trim()).filter(Boolean);
const SYSTEM_COLS = [K.SR, K.CREATED_AT, K.CREATED_BY, K.UPDATED_AT, K.UPDATED_BY, K.ARCHIVED];
const TYPE_NAMES = {
  text: 'Short text', longtext: 'Long text / notes', phone: 'Phone number', number: 'Number', date: 'Date',
  picklist: 'Picklist (pick one)', multiselect: 'Multi-select (pick several)', picklist_custom: 'Picklist + add new', gps: 'GPS location', photos: 'Photos'
};

async function api(action, payload = {}, opts = {}) {
  if (DEMO) return Demo.call(action, payload, S.auth, opts);
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, auth: S.auth, ...payload }) });
  } catch {
    S.online = false; updateStatusDot();
    throw new Error('No internet connection. Check your mobile data and try again.');
  }
  S.online = true; updateStatusDot();
  let j;
  try { j = await res.json(); } catch { throw new Error('The server did not answer properly. Check the API link in the setup.'); }
  if (!j.ok && /^Unknown action/.test(j.error || '')) j.error = 'The Google script is an older version. Admin: update Code.gs (SETUP.md, Part 11).';

const photoCache = {};
function photoSrc(id, w = 600) {

// If Google's thumbnail link fails, load the photo through our own server instead
document.addEventListener('error', async e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.dataset.pid || img.dataset.fb) return;
  img.dataset.fb = '1';
  try { const r = await api('getPhoto', { id: img.dataset.pid }); if (r.dataUrl) { photoCache[img.dataset.pid] = r.dataUrl; img.src = r.dataUrl; } } catch { }
}, true);

function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
async function shrinkDataUrl(src, max, q) {
  const im = await loadImage(src);
  const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}

  // Fast path: decode straight from the file (keeps the photo the right way up)
  if (window.createImageBitmap) {
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const sc = Math.min(1, PHOTO_MAX / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      bmp.close && bmp.close();
      const out = c.toDataURL('image/jpeg', PHOTO_Q); c.width = c.height = 0;
      return out;
    } catch { /* fall back below */ }
  }
  const url = URL.createObjectURL(file);
  try { return await shrinkDataUrl(url, PHOTO_MAX, PHOTO_Q); } finally { URL.revokeObjectURL(url); }
}

/* In-app camera: the page never leaves the screen, so Android can't reload it.
   Take several photos in a row; each one is added to the lead straight away. */
async function openCamera(onShot, useNative) {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { useNative(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) {
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
      toast('Camera is blocked for this app. Allow Camera in phone settings, or use "From gallery".', true);
    } else useNative();
    return;
  }
  let n = 0;
  const stop = () => stream.getTracks().forEach(t => t.stop());
  const L = openLayer({
    cls: 'camera', head: '',
    body: `<video class="cam-video" playsinline autoplay muted></video><div class="cam-flash"></div>
      <div class="cam-top"><button class="icon-btn" data-close>${icon('x', 'Close camera')}</button>
        <button class="btn small" data-native>Use phone camera app</button></div>
      <div class="cam-bar"><span class="cam-count" aria-live="polite">Tap the button to take a photo</span>
        <button class="shutter" data-shoot aria-label="Take photo"></button>
        <button class="btn small primary cam-done" data-close>Done</button></div>`,
    onClose: stop
  });
  wireClose(L);
  const v = $('video', L.el); v.srcObject = stream;
  try { await v.play(); } catch { }
  $('[data-native]', L.el).onclick = () => { closeTop(true); setTimeout(useNative, 60); };
  $('[data-shoot]', L.el).onclick = () => {
    if (!v.videoWidth) return;
    const sc = Math.min(1, PHOTO_MAX / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', PHOTO_Q); c.width = c.height = 0;
    n++;
    $('.cam-count', L.el).textContent = `${n} photo${n > 1 ? 's' : ''} added`;
    const fl = $('.cam-flash', L.el); fl.classList.add('on'); setTimeout(() => fl.classList.remove('on'), 60);
    if (navigator.vibrate) try { navigator.vibrate(30); } catch { }
    onShot(data);
  };
}

function searchText(l) { return Object.values(l).join(' ').toLowerCase() + ' ' + digits(Object.values(l).join(' ')); }
function visibleLeads() {
  const words = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const out = S.leads.filter(l => {
    if (!S.showArchived && l[K.ARCHIVED] === 'Yes') return false;
    for (const [lab, set] of Object.entries(S.filters)) {
      if (!set.size) continue;
      const f = field(lab);
      if (lab === K.LSTATUS) { if (!set.has(leadStatus(l))) return false; }
      else if (f && f.type === 'multiselect') {
        const vals = multi(l[lab]);
        if (!(vals.length ? vals.some(v => set.has(v)) : set.has('(blank)'))) return false;
      } else if (!set.has(l[lab] || '(blank)')) return false;
    }
    if (S.follow !== 'all') {
      const st = followState(l[K.FOLLOW]);
      if (S.follow === 'none' ? !!l[K.FOLLOW] : S.follow === 'week' ? !(st === 'today' || st === 'soon') : st !== S.follow) return false;
    }
    if (words.length) { const t = searchText(l); if (!words.every(w => t.includes(w))) return false; }
    return true;
  });
  const { key, dir } = S.sort;
  const get = l => key === '__title' ? leadTitle(l).name : (l[key] || '');
  out.sort((a, b) => {
    const x = get(a), y = get(b);
    if (!x && !y) return (+b[K.SR]) - (+a[K.SR]);
    if (!x) return 1; if (!y) return -1;
    const nx = +x, ny = +y;
    const c = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : String(x).localeCompare(String(y), undefined, { sensitivity: 'base', numeric: true });
    return c * dir || (+b[K.SR]) - (+a[K.SR]);
  });
  return out;
}

// Drag the edge of a column title to change its width (saved for this person)
function wireResize(el) {
  $$('.rz', el).forEach(h => {
    h.addEventListener('click', e => e.stopPropagation());
    h.addEventListener('dblclick', e => { e.stopPropagation(); setColWidth(h.dataset.rz, defaultWidth(h.dataset.rz)); renderList(); });
    h.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      const key = h.dataset.rz, col = $(`col[data-col="${CSS.escape(key)}"]`, el), table = $('table', el);
      const x0 = e.clientX, w0 = parseInt(col.style.width), t0 = parseInt(table.style.width);
      h.classList.add('on');
      const mv = ev => { const w = Math.max(70, Math.round(w0 + ev.clientX - x0)); col.style.width = w + 'px'; table.style.width = (t0 + w - w0) + 'px'; };
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); h.classList.remove('on'); setColWidth(key, parseInt(col.style.width)); };
      addEventListener('pointermove', mv);
      addEventListener('pointerup', up);
      addEventListener('pointercancel', up);
    });
  });
}

function stageHTML(lead, withProject = true) {

    const steps = f.options.filter(o => !/hold|abandon/i.test(o));

    const hold = /hold|abandon/i.test(v);
    if (idx >= 0 || hold) pips = `<span class="pips ${hold ? 'hold' : ''}" aria-hidden="true">${steps.map((_, i) => `<i class="${hold || i <= idx ? 'on' : ''}"></i>`).join('')}</span>`;
  }

// P = personal layout (this person's saved one; the Arrange screen passes a draft for its preview)
function cardHTML(l, P = prefs()) {

  const titleSec = (field(t.label) || {}).section;
  const contacts = [];
  for (const sec of sections) {
    const sf = fields.filter(f => f.section === sec);

    if (!ph) continue;
    const nameF = sf.find(f => f.type === 'text' && f.card) || sf.find(f => f.type === 'text');
    sf.forEach(f => { if (f === ph || f === nameF) used.add(f.label); });
    if (sec === titleSec || !C.contacts) continue; // the title person is already shown big
    const tags = sf.filter(f => f.card && (f.type === 'picklist' || f.type === 'picklist_custom') && l[f.label] && !(f.label === K.CTYPE && C.ctype));
    const name = nameF ? l[nameF.label] : '', num = l[ph.label];
    if (!name && !num) continue;
    contacts.push(`<li><span class="role">${esc(sec)}</span><span class="who">${esc(name || num)}</span>${tags.map(x => `<span class="tag">${esc(l[x.label])}</span>`).join('')}${num ? `<a class="icon-btn call" href="${telLink(num)}" aria-label="Call ${esc(sec)}">${icon('phone')}</a>` : ''}</li>`);

  const ph = fields.find(f => f.type === 'photos' && f.card);
  if (gps) used.add(gps.label); if (ph) used.add(ph.label);
  const extras = C.extras ? fields.filter(f => f.card && !used.has(f.label) && l[f.label] && f.type !== 'gps' && f.type !== 'photos') : [];
  const pics = ph ? photoIds(l[ph.label]) : [];
  const loc = gps ? l[gps.label] : '';
  const subF = C.sub ? field(C.sub) : null;
  const subV = subF && l[C.sub] ? (subF.type === 'date' ? fmtDate(l[C.sub]) : l[C.sub]) : '';
  const hasStatus = field(K.LSTATUS) && field(K.LSTATUS).active;
  return `<article class="card ${l[K.ARCHIVED] === 'Yes' ? 'archived' : ''} ${S.picked === l[K.SR] ? 'picked' : ''}" data-sr="${esc(l[K.SR])}" tabindex="0">
