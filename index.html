      ${l[K.ARCHIVED] === 'Yes' ? '<span class="badge arch">Archived</span>' : ''}
      ${C.follow ? followChip(l) : ''}</div>
    <h3>${titleHTML(t)}<span class="title-role">${esc(t.role)}</span>${t.phone ? `<a class="icon-btn call" href="${telLink(t.phone)}" aria-label="Call ${esc(t.role.toLowerCase())}">${icon('phone')}</a>` : ''}</h3>
    ${subV ? `<p class="addr">${esc(subV)}</p>` : ''}
    ${C.stage ? stageHTML(l, !C.project) : ''}
    ${reasonHTML(l)}
    ${contacts.length ? `<ul class="contacts">${contacts.join('')}</ul>` : ''}
    ${extras.length ? `<dl class="extra">${extras.map(f => `<dt>${esc(f.label)}</dt><dd>${esc(f.type === 'date' ? fmtDate(l[f.label]) : l[f.label])}</dd>`).join('')}</dl>` : ''}
    ${C.foot && (loc || pics.length) ? `<div class="card-foot">
      ${loc ? `<a class="maplink" href="${esc(navLink(loc))}" target="_blank" rel="noopener">${icon('nav')}Directions</a>` : ''}
      <span class="spacer"></span>
      ${pics.length ? `<span>${pics.length} photo${pics.length > 1 ? 's' : ''}</span><img class="thumb" loading="lazy" alt="" data-pid="${esc(pics[0])}" src="${esc(photoSrc(pics[0], 200))}">` : ''}
    </div>` : ''}
  </article>`;
}

/* ---------- Big list ---------- */
function cellHTML(key, l) {
  if (key === '__name') { const t = leadTitle(l); return `<b>${esc(t.name || t.phone || '—')}</b><div class="sub">${esc(t.role)}</div>`; }
  if (key === '__updated') return esc(fmtStamp(l[K.UPDATED_AT]));
  if (key === '__by') return esc(l[K.UPDATED_BY] || '');
  const f = field(key); let v = l[key];
  if (!f) return esc(v || '');
  if (f.label === K.LSTATUS) { v = v || statusOptions()[0]; return `<span class="badge status ${statusClass(v)}">${esc(v)}</span>`; }
  if (!v) return '';
  switch (f.type) {
    case 'phone': return `<a href="${telLink(v)}">${esc(v)}</a>`;
    case 'gps': return `<a href="${esc(mapsLink(v))}" target="_blank" rel="noopener">Map</a>`;
    case 'photos': { const n = photoIds(v).length; return n ? `${n} photo${n > 1 ? 's' : ''}` : ''; }
    case 'multiselect': return `<span class="badges">${typeBadges(v)}</span>`;
    case 'date': { const st = followState(v); return f.label === K.FOLLOW && st && st !== 'later' && isOpen(l) ? `<span class="fu ${st}">${esc(fmtDate(v))}</span>` : esc(fmtDate(v)); }
    default: return esc(v).replace(/\n/g, '<br>');
  }
}
const sortKeyOf = k => k === '__name' ? '__title' : k === '__updated' ? K.UPDATED_AT : k === '__by' ? K.UPDATED_BY : k;
function tableHTML(leads, more = '') {
  const cols = colsList().filter(c => c.show);
  const total = 64 + cols.reduce((n, c) => n + c.w, 0);
  const stick2 = cols[0] && cols[0].key === '__name';
  const arrow = sk => S.sort.key === sk ? `<span class="arrow">${S.sort.dir > 0 ? '▲' : '▼'}</span>` : '';
  const th = (c, i) => {
    const sk = sortKeyOf(c.key), on = S.sort.key === sk;
    return `<th class="${i === 0 && stick2 ? 'stk2' : ''}" aria-sort="${on ? (S.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button data-sort="${esc(sk)}">${esc(colLabel(c.key))}${arrow(sk)}</button><span class="rz" data-rz="${esc(c.key)}" title="Drag to change width. Double-click to reset."></span></th>`;
  };
  return `<div class="table-wrap"><table class="grid" style="width:${total}px">
    <colgroup><col style="width:64px">${cols.map(c => `<col data-col="${esc(c.key)}" style="width:${c.w}px">`).join('')}</colgroup>
    <thead><tr><th class="stk"><button data-sort="${K.SR}">Sr.${arrow(K.SR)}</button></th>${cols.map(th).join('')}</tr></thead>
    <tbody>${leads.map(l => `<tr data-sr="${esc(l[K.SR])}" tabindex="0" class="${S.picked === l[K.SR] ? 'picked' : ''}">
      <td class="stk"><span class="plate">${esc(l[K.SR])}</span></td>
      ${cols.map((c, i) => `<td class="${i === 0 && stick2 ? 'stk2' : ''}">${cellHTML(c.key, l)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>${more}</div>`;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#list [data-sr]')) openForm(e.target.dataset.sr);
});

/* ======================= LAYERS (screens over the list) ======================= */
const layers = [];
function openLayer({ cls = '', head, body, foot = '', onClose, beforeClose }) {
  const el = document.createElement('div');
  el.className = 'layer ' + cls;
  el.innerHTML = `<div class="panel" role="dialog" aria-modal="true">${head}<div class="panel-body">${body}</div>${foot ? `<div class="panel-foot">${foot}</div>` : ''}</div>`;
  el.addEventListener('click', e => { if (e.target === el) closeTop(); });
  $('#layers').appendChild(el);
  const L = { el, onClose, beforeClose, force: false };
  layers.push(L);
  history.pushState({ layer: layers.length }, '');
  document.body.classList.add('locked');
  requestAnimationFrame(() => el.classList.add('in'));
  return L;
}
function closeTop(force) { const L = layers[layers.length - 1]; if (!L) return; if (force) L.force = true; history.back(); }
window.addEventListener('popstate', () => {
  const L = layers[layers.length - 1]; if (!L) return;
  if (!L.force && L.beforeClose && !L.beforeClose()) { history.pushState({ layer: layers.length }, ''); return; }
  layers.pop(); L.el.remove(); if (L.onClose) L.onClose();
  if (!layers.length) document.body.classList.remove('locked');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layers.length) closeTop(); });
const headBar = (title, left = 'back', right = '') =>
  `<div class="panel-head"><button class="icon-btn" data-close>${icon(left === 'close' ? 'x' : 'back', left === 'close' ? 'Close' : 'Back')}</button><h2>${title}</h2>${right}</div>`;
function wireClose(L) { $$('[data-close]', L.el).forEach(b => b.onclick = () => closeTop()); }

/* ======================= MENU ======================= */
function openMenu() {
  const old = $('.menu'); if (old) { old.remove(); return; }
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = `
    <button data-a="export">${icon('download')}Export to Excel (CSV)</button>
    <button data-a="arrange">${icon('arrange')}Arrange list and cards</button>
    <button data-a="settings">${icon('gear')}Columns and settings</button>
    <hr><button data-a="logout">${icon('logout')}Log out</button>`;
  document.body.appendChild(m);
  const close = e => { if (!m.contains(e.target) && e.target.closest('#btnMenu') === null) { m.remove(); document.removeEventListener('click', close, true); } };
  setTimeout(() => document.addEventListener('click', close, true));
  m.onclick = e => {
    const a = e.target.closest('button')?.dataset.a; if (!a) return;
    m.remove(); document.removeEventListener('click', close, true);
    if (a === 'export') exportCSV();
    if (a === 'settings') openSettings();
    if (a === 'arrange') openArrange(S.view === 'list' ? 'cols' : 'card');
    if (a === 'logout' && confirm('Log out of Site Leads on this device?')) logout();
  };
}

/* ======================= EXPORT ======================= */
function exportCSV() {
  const leads = visibleLeads();
  const fields = F_();
  const cols = [K.SR, ...fields.map(f => f.label), K.CREATED_AT, K.CREATED_BY, K.UPDATED_AT, K.UPDATED_BY, K.ARCHIVED];
  const typeOf = Object.fromEntries(fields.map(f => [f.label, f.type]));
  const cell = (c, v) => {
    v = v || '';
    if (typeOf[c] === 'photos') v = DEMO ? `${photoIds(v).length} photo(s)` : photoIds(v).map(id => `https://drive.google.com/file/d/${id}/view`).join(' ');
    if (typeOf[c] === 'gps') v = mapsLink(v) || v;
    if (/^[=+\-@]/.test(v)) v = "'" + v;
    return `"${String(v).replace(/"/g, '""')}"`;
  };
  const csv = '﻿' + [cols.map(c => cell('', c)).join(','), ...leads.map(l => cols.map(c => cell(c, l[c])).join(','))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `site-leads-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Exported ${leads.length} lead${leads.length === 1 ? '' : 's'}`);
}

/* ======================= FILTERS ======================= */
function openFilters() {
  // Lead Status has its own buttons at the top of the list
  const pick = F_().filter(f => f.label !== K.LSTATUS && f.label !== K.CARDNAME && (f.type === 'picklist' || f.type === 'picklist_custom' || f.type === 'multiselect'));
  const valuesFor = f => {
    const present = new Set(f.type === 'multiselect'
      ? S.leads.flatMap(l => multi(l[f.label]).length ? multi(l[f.label]) : ['(blank)'])
      : S.leads.map(l => l[f.label] || '(blank)'));
    const vals = [...f.options.filter(o => present.has(o)), ...[...present].filter(v => !f.options.includes(v) && v !== '(blank)').sort()];
    if (present.has('(blank)')) vals.push('(blank)');
    return vals;
  };
  const followOpts = [['all', 'Any'], ['overdue', 'Overdue'], ['today', 'Today'], ['week', 'Next 7 days'], ['none', 'No date set']];
  const body = `
    <div class="f-group"><h4>Follow-up</h4><div class="opts">${followOpts.map(([k, n]) => `<button class="opt" data-follow="${k}" aria-pressed="${S.follow === k}">${n}</button>`).join('')}</div></div>
    ${pick.map(f => {
      const vals = valuesFor(f); if (!vals.length) return '';
      const set = S.filters[f.label] || new Set();
      return `<div class="f-group"><h4>${esc(f.label)}</h4><div class="opts">${vals.map(v => `<button class="opt" data-fl="${esc(f.label)}" data-v="${esc(v)}" aria-pressed="${set.has(v)}">${esc(v === '(blank)' ? 'Not filled' : v)}</button>`).join('')}</div></div>`;
    }).join('')}
    <div class="f-group"><h4>Archived leads</h4><div class="checks"><label><input type="checkbox" id="fArch" ${S.showArchived ? 'checked' : ''}> Show archived leads</label></div></div>`;
  const L = openLayer({
    cls: 'sheet', head: headBar('Filter leads', 'close'), body,
    foot: `<button class="btn" id="fClear">Clear all</button><button class="btn primary" id="fDone">Show leads</button>`
  });
  wireClose(L);
  const upd = () => { renderList(); $('#fDone', L.el).textContent = `Show ${visibleLeads().length} leads`; };
  $$('[data-follow]', L.el).forEach(b => b.onclick = () => { S.follow = b.dataset.follow; $$('[data-follow]', L.el).forEach(x => x.setAttribute('aria-pressed', x === b)); upd(); });
  $$('[data-fl]', L.el).forEach(b => b.onclick = () => {
    const s = S.filters[b.dataset.fl] || (S.filters[b.dataset.fl] = new Set());
    s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v);
    b.setAttribute('aria-pressed', s.has(b.dataset.v)); upd();
  });
  $('#fArch', L.el).onchange = e => { S.showArchived = e.target.checked; upd(); };
  $('#fClear', L.el).onclick = () => { clearFilters(); $$('.opt', L.el).forEach(b => b.setAttribute('aria-pressed', b.dataset.follow === 'all')); $('#fArch', L.el).checked = false; upd(); };
  $('#fDone', L.el).onclick = () => closeTop();
  upd();
}

/* ======================= LEAD PANEL (opens from the right, edit in place) ======================= */
const drawerHead = (title, sub = '') =>
  `<div class="dhead"><div class="dh-main"><h2 class="d-title">${title}</h2>${sub ? `<p class="d-addr">${sub}</p>` : ''}</div><button class="xbtn" data-close aria-label="Close">${icon('x')}</button></div>`;

function histText(h) {
  const v = (s, tag) => s ? `<${tag}>${esc(s)}</${tag}>` : '<i>empty</i>';
  switch (h.action) {
    case 'Created': return '<b>Lead created</b>';
    case 'Updated': return `<b>${esc(h.field)}</b> changed from ${v(h.old, 'del')} to ${v(h.new, 'ins')}`;
    case 'Photo added': return `<b>${esc(h.new)}</b> added`;
    case 'Photo removed': return `<b>${esc(h.old)}</b> removed`;
    case 'Archived': return '<b>Lead archived</b>';
    case 'Restored': return '<b>Lead restored</b>';
    case 'Deleted': return '<b>Lead deleted</b>';
    default: return esc(h.action + (h.field ? ': ' + h.field : ''));
  }
}
function openViewer(id) {
  const L = openLayer({
    cls: 'viewer',
    head: `<div class="vbar"><button class="icon-btn" data-close>${icon('x', 'Close')}</button>${DEMO ? '' : `<a class="icon-btn" href="https://drive.google.com/file/d/${esc(id)}/view" target="_blank" rel="noopener">${icon('ext', 'Open in Google Drive')}</a>`}</div>`,
    body: `<img alt="Site photo" data-pid="${esc(id)}" src="${esc(photoSrc(id, 1600))}">`
  });
  const p = $('.panel', L.el); p.style.cssText = 'background:transparent;box-shadow:none;align-items:center;justify-content:center';
  $('.panel-body', L.el).style.cssText = 'display:grid;place-items:center;flex:1;width:100%';
  wireClose(L);
}

/* One panel for both: a new lead, and viewing/editing an existing lead.
   Every value is editable where it is shown. Save and Cancel act on your
   changes; the ✕ at the top right closes the panel. */
function openForm(sr, resume) {
  const isNew = !sr;
  if (!isNew && !S.leads.some(l => l[K.SR] === String(sr))) return;
  const fields = F_();
  const sections = [...new Set(fields.filter(f => f.label !== K.CARDNAME).map(f => f.section))];
  let st, orig, initial, draftRestored, tab = 'details';

  const changedLabels = () => fields.filter(f => f.type !== 'photos' && (st.vals[f.label] || '') !== (initial[f.label] || '')).map(f => f.label);
  const photosChanged = () => Object.values(st.photos).some(p => p.added.length || p.removed.length);
  const dirty = () => !!st && (changedLabels().length > 0 || photosChanged());

  const L = openLayer({
    cls: 'drawer lead', head: '<div data-head></div>', body: '', foot: '<div data-foot></div>',
    onClose: () => { store.del('sl_open_form'); S.picked = null; markPicked(); },
    beforeClose: () => {
      if (!dirty() || st.saving) return true;
      return confirm(isNew ? 'Close this form? Your entries are kept as an unfinished lead on this phone, so you can continue later.' : 'Close without saving? Your changes to this lead will be lost.');
    }
  });
  L.sr = isNew ? null : String(sr);
  if (!isNew) { S.picked = String(sr); markPicked(); }
  const root = L.el, panel = $('.panel', root);
  panel.classList.add('inline');

  function mount(resumeState) {
    orig = isNew ? {} : Object.assign({}, S.leads.find(l => l[K.SR] === String(sr)) || {});
    st = { vals: {}, photos: {}, pending: 0, saving: false };
    fields.forEach(f => {
      st.vals[f.label] = orig[f.label] || '';
      if (f.type === 'photos') st.photos[f.label] = { list: photoIds(orig[f.label]), added: [], removed: [] };
    });
    if (isNew) { const df = field(K.DATE); if (df && df.active) st.vals[K.DATE] = todayISO(); }
    // Lead Status always has a value: new (and old blank) leads start as Open
    if (field(K.LSTATUS) && field(K.LSTATUS).active && !st.vals[K.LSTATUS]) st.vals[K.LSTATUS] = statusOptions()[0];
    initial = Object.assign({}, st.vals);
    draftRestored = false;
    if (resumeState && resumeState.vals) { // the page reloaded while this panel was open
      Object.assign(st.vals, resumeState.vals);
      for (const k in resumeState.photos || {}) if (st.photos[k]) st.photos[k] = resumeState.photos[k];
      draftRestored = dirty() ? 'reload' : false;
    } else if (isNew) {
      const dr = store.get('sl_draft');
      if (dr && (Object.values(dr.vals || {}).some(Boolean) || Object.values(dr.photos || {}).some(p => p.added.length))) {
        Object.assign(st.vals, dr.vals); for (const k in dr.photos) if (st.photos[k]) st.photos[k] = dr.photos[k];
        draftRestored = true;
      }
    }
    const archived = orig[K.ARCHIVED] === 'Yes';
    const isAdmin = S.user && S.user.role === 'Admin';

    // ---- header ----
    let head;
    if (isNew) head = drawerHead('New lead', 'Fill in what you know. Everything can be added later.');
    else {
      const t = leadTitle(orig);
      const gpsF = fields.find(f => f.type === 'gps' && orig[f.label]);
      const hasStatus = field(K.LSTATUS) && field(K.LSTATUS).active;
      head = `<div class="dhead"><div class="dh-main">
          <div class="d-top"><span class="plate">#${esc(orig[K.SR])}</span>${hasStatus ? statusBadge(orig) : ''}${typeBadges(orig[K.TYPE])}${archived ? '<span class="badge arch">Archived</span>' : ''}${followChip(orig)}</div>
          <h2 class="d-title">${esc(t.name || t.phone || t.role + ' not added')}</h2>
          <p class="d-addr">${esc(t.role)}${orig[K.CTYPE] ? ' · ' + esc(orig[K.CTYPE]) : ''}${orig[K.ADDR] ? ' · ' + esc(orig[K.ADDR]) : ''}</p>
          <div class="actions">
            ${t.phone ? `<a class="btn small" href="${telLink(t.phone)}">${icon('phone')}Call ${esc(t.role.toLowerCase())}</a><a class="btn small" href="${esc(waLink(t.phone))}" target="_blank" rel="noopener">${icon('chat')}WhatsApp</a>` : ''}
            ${gpsF ? `<a class="btn small" href="${esc(navLink(orig[gpsF.label]))}" target="_blank" rel="noopener">${icon('nav')}Directions</a>` : ''}
          </div></div>
        <button class="xbtn" data-close aria-label="Close">${icon('x')}</button></div>`;
    }
    $('[data-head]', root).innerHTML = head;

    // ---- body ----
    $('.panel-body', root).innerHTML = `
      ${draftRestored ? `<div class="draft-note"><span>${draftRestored === 'reload' ? 'The page reloaded, so we restored what you had entered.' : "We kept the lead you didn't finish last time."}</span><button class="btn small" id="discardDraft">Start fresh</button></div>` : ''}
      ${archived ? `<div class="arch-note"><span>This lead is archived, so it can't be edited. Restore it to make changes.</span><button class="btn small" id="restoreTop">${icon('archive')}Restore</button></div>` : ''}
      ${isNew ? '' : `<div class="tabs" role="tablist"><button role="tab" data-tab="details" aria-selected="${tab === 'details'}">Details</button><button role="tab" data-tab="history" aria-selected="${tab === 'history'}">Change history</button></div>`}
      <div class="pane" data-pane="details" ${tab === 'details' ? '' : 'hidden'}>
        <fieldset class="fs" ${archived ? 'disabled' : ''}>
        ${sections.map(sec => `
          <section class="sec" data-sec="${esc(sec)}">
            <button class="sec-h" type="button" aria-expanded="true"><h3>${esc(sec)}</h3><span class="filled"></span><span class="chev">${icon('chev')}</span></button>
            <div class="sec-b">${fields.filter(f => f.section === sec && f.label !== K.CARDNAME).map(f => fieldHTML(f, st, !isNew)).join('')}</div>
          </section>`).join('')}
        </fieldset>
        ${isNew ? '' : `<p class="meta">Added by ${esc(orig[K.CREATED_BY] || '—')} on ${esc(fmtStamp(orig[K.CREATED_AT]))}<br>Last changed by ${esc(orig[K.UPDATED_BY] || '—')} on ${esc(fmtStamp(orig[K.UPDATED_AT]))}</p>
        <div class="danger-zone">
          <button class="btn" id="dArch" type="button">${icon('archive')}${archived ? 'Restore this lead' : 'Archive this lead'}</button>
          ${isAdmin ? `<button class="btn danger" id="dDel" type="button">${icon('trash')}Delete permanently</button>` : ''}
          <p class="hint">${isAdmin ? 'Archive hides the lead and can be undone. Delete removes it from the sheet; a copy is kept in the History tab.' : 'Archive hides the lead and can be undone. Only the admin can delete leads permanently.'}</p>
        </div>`}
      </div>
      ${isNew ? '' : `<div class="pane" data-pane="history" ${tab === 'history' ? '' : 'hidden'}></div>`}`;

    // ---- footer ----
    $('.panel-foot', root).innerHTML = '<span class="fmsg grow" data-fmsg></span><button class="btn" type="button" data-cancel>Cancel</button><button class="btn primary" type="button" id="fSave">' + (isNew ? 'Save lead' : 'Save changes') + '</button>';
    wire(archived);
    if (tab === 'history') loadHistory();
  }

  function updateFoot() {
    const msg = $('[data-fmsg]', root), save = $('#fSave', root), cancel = $('[data-cancel]', root);
    if (!msg) return;
    const n = changedLabels().length + (photosChanged() ? 1 : 0);
    if (isNew) { msg.textContent = st.pending ? 'Uploading photos…' : ''; if (!st.saving) save.disabled = st.pending > 0; return; }
    msg.textContent = st.pending ? 'Uploading photos…' : n ? `${n} unsaved change${n > 1 ? 's' : ''}` : 'No changes';
    msg.classList.toggle('dirty', !!n);
    if (!st.saving) save.disabled = !n || st.pending > 0;
    cancel.disabled = !n;
  }
  // Changed fields get a yellow marker and show the saved value
  function markChanges() {
    if (isNew) return;
    $$('.fld[data-f]', root).forEach(el => {
      const lab = el.dataset.f, f = field(lab); if (!f) return;
      const ch = f.type === 'photos' ? (st.photos[lab].added.length || st.photos[lab].removed.length) : (st.vals[lab] || '') !== (initial[lab] || '');
      el.classList.toggle('chg', !!ch);
      let w = $('.was', el);
      if (ch && f.type !== 'photos' && f.type !== 'gps') {
        if (!w) { w = document.createElement('div'); w.className = 'was'; el.appendChild(w); }
        const old = initial[lab] || '';
        w.textContent = old ? `Was: ${f.type === 'date' ? fmtDate(old) : old}` : 'Was empty';
      } else if (w) w.remove();
    });
  }
  function loadHistory() {
    const pane = $('[data-pane="history"]', root); if (!pane) return;
    pane.innerHTML = '<div class="loading"><span class="spin"></span> Loading history</div>';
    api('history', { sr: orig[K.SR] }).then(({ history }) => {
      pane.innerHTML = history.length ? `<ul class="hist">${history.map(h => `<li><div class="when">${esc(fmtStamp(h.at))}, by ${esc(h.user)}</div><div class="what">${histText(h)}</div></li>`).join('')}</ul>` : '<p class="empty">No changes recorded yet.</p>';
    }).catch(e => { pane.innerHTML = `<p class="hint err">${esc(e.message)}</p>`; });
  }

  function wire(archived) {
    wireClose(L);
    const saveDraft = () => {
      if (isNew) store.set('sl_draft', { vals: st.vals, photos: st.photos });
      // remembered while the panel is open, so it comes back if the phone reloads the page
      store.set('sl_open_form', { sr: isNew ? null : String(sr), vals: st.vals, photos: st.photos, at: Date.now() });
    };
    const grow = t => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; };
    // The reason box only shows (and is required) when the status is Not Converted
    function toggleReason(focus) {
      const box = $('[data-reason]', root); if (!box) return;
      const show = isNotConv(st.vals[K.LSTATUS]);
      box.classList.toggle('hidden', !show);
      if (show) { const t = $('textarea', box); grow(t); if (focus) setTimeout(() => t.focus(), 50); }
    }
    const secCount = () => $$('.sec', root).forEach(s => {
      const fs = fields.filter(f => f.section === s.dataset.sec && f.label !== K.CARDNAME);
      const n = fs.filter(f => f.type === 'photos' ? st.photos[f.label].list.length : st.vals[f.label]).length;
      $('.filled', s).textContent = `${n} of ${fs.length} filled`;
    });
    const changed = () => { saveDraft(); secCount(); markChanges(); updateFoot(); };
    st.onPending = updateFoot;

    $$('[data-tab]', root).forEach(b => b.onclick = () => {
      tab = b.dataset.tab;
      $$('[data-tab]', root).forEach(x => x.setAttribute('aria-selected', x.dataset.tab === tab));
      $$('.pane', root).forEach(p => p.hidden = p.dataset.pane !== tab);
      if (tab === 'history') loadHistory();
    });
    $$('.sec-h', root).forEach(h => h.onclick = () => { const s = h.parentElement; s.classList.toggle('closed'); h.setAttribute('aria-expanded', !s.classList.contains('closed')); });

    $$('[data-in]', root).forEach(inp => {
      inp.addEventListener('input', () => { st.vals[inp.dataset.in] = inp.value; if (inp.tagName === 'TEXTAREA') grow(inp); changed(); });
      if (inp.tagName === 'TEXTAREA') requestAnimationFrame(() => grow(inp));
    });
    // phone duplicate check
    $$('input[type=tel][data-in]', root).forEach(inp => inp.addEventListener('blur', () => {
      const d = digits(inp.value).slice(-10), hint = $(`[data-dup="${CSS.escape(inp.dataset.in)}"]`, root);
      if (!hint) return;
      if (d.length < 10) { hint.textContent = ''; return; }
      const hit = S.leads.find(l => l[K.SR] !== orig[K.SR] && fields.some(f => f.type === 'phone' && digits(l[f.label]).slice(-10) === d));
      hint.textContent = hit ? `This number is already in lead #${hit[K.SR]}${hit[K.TITLE] ? ' (' + hit[K.TITLE] + ')' : ''}.` : '';
    }));
    // picklist chips
    $$('.opts[data-pick]', root).forEach(box => box.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b) return;
      const lab = box.dataset.pick, v = b.dataset.v;
      if (lab === K.LSTATUS && st.vals[lab] === v) return; // status can't be left empty
      st.vals[lab] = st.vals[lab] === v ? '' : v;
      if (lab === K.LSTATUS) toggleReason(true);
      $$('.opt', box).forEach(x => x.setAttribute('aria-pressed', x.dataset.v === st.vals[lab]));
      changed();
    }));
    // multi-select chips: tap to add or remove; saved as "Cement, RMC" in the option order
    $$('.opts[data-multi]', root).forEach(box => box.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b) return;
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on); b.textContent = (on ? '✓ ' : '') + b.dataset.v;
      st.vals[box.dataset.multi] = $$('.opt', box).filter(x => x.getAttribute('aria-pressed') === 'true').map(x => x.dataset.v).join(', ');
      changed();
    }));
    // "On card" toggles: exactly one person's name shows on the card
    $$('[data-oncard]', root).forEach(sw => sw.addEventListener('change', () => {
      if (!sw.checked) { sw.checked = true; return; } // one must stay on: pick another name instead
      st.vals[K.CARDNAME] = sw.dataset.oncard;
      $$('[data-oncard]', root).forEach(x => { x.checked = x === sw; x.closest('.onc').classList.toggle('on', x === sw); });
      changed();
    }));
    // picklist + add new
    $$('select[data-pc]', root).forEach(sel => sel.addEventListener('change', () => {
      const lab = sel.dataset.pc, other = $(`[data-pcnew="${CSS.escape(lab)}"]`, root);
      if (sel.value === '__new') { other.classList.remove('hidden'); other.value = ''; st.vals[lab] = ''; other.focus(); }
      else { other.classList.add('hidden'); st.vals[lab] = sel.value; }
      changed();
    }));
    $$('[data-pcnew]', root).forEach(inp => inp.addEventListener('input', () => { st.vals[inp.dataset.pcnew] = inp.value.trim(); changed(); }));
    if (!archived) {
      $$('[data-gps]', root).forEach(box => wireGPS(box, st, changed));
      $$('[data-photos]', root).forEach(box => wirePhotos(box, st, changed, root));
    } else {
      $$('[data-gps]', root).forEach(box => { const v = st.vals[box.dataset.gps]; box.innerHTML = v ? `<a href="${esc(mapsLink(v))}" target="_blank" rel="noopener">Open in Maps</a>` : '<span class="hint" style="margin:0">Not added</span>'; });
      $$('[data-photos]', root).forEach(box => { const ids = st.photos[box.dataset.photos].list; box.innerHTML = ids.length ? `<div class="photos">${ids.map(id => `<button type="button" class="ph" data-view="${esc(id)}"><img alt="" data-pid="${esc(id)}" src="${esc(photoSrc(id, 300))}"></button>`).join('')}</div>` : '<span class="hint" style="margin:0">No photos</span>'; });
      $$('[data-view]', root).forEach(b => b.onclick = () => openViewer(b.dataset.view));
    }

    const dd = $('#discardDraft', root);
    if (dd) dd.onclick = () => { if (isNew) store.del('sl_draft'); mount(); };

    // Archive / restore / delete
    const doArchive = async (toArchived) => {
      if (dirty() && !confirm('You have unsaved changes. Continue without saving them?')) return;
      if (toArchived && !confirm('Archive this lead? It will be hidden from the list but nothing is deleted. You can restore it later.')) return;
      try {
        const r = await api('archive', { sr: orig[K.SR], archived: toArchived });
        upsertLead(r.lead); renderList(); mount();
        toast(toArchived ? 'Lead archived' : 'Lead restored');
      } catch (e) { toast(e.message, true); }
    };
    const ab = $('#dArch', root); if (ab) ab.onclick = () => doArchive(!archived);
    const rt = $('#restoreTop', root); if (rt) rt.onclick = () => doArchive(false);
    const del = $('#dDel', root);
    if (del) del.onclick = async () => {
      const t = leadTitle(orig), nm = t.name ? ` (${t.name})` : '';
      if (!confirm(`Delete lead #${orig[K.SR]}${nm} permanently?\n\nIt will be removed from the list and the Google Sheet for everyone. This cannot be undone from the app.`)) return;
      del.disabled = true; del.innerHTML = '<span class="spin"></span> Deleting';
      try {
        await api('deleteLead', { sr: orig[K.SR] });
        S.leads = S.leads.filter(x => x[K.SR] !== orig[K.SR]); saveCache();
        closeTop(true); renderList(); toast(`Lead #${orig[K.SR]} deleted`);
      } catch (e) { toast(e.message, true); del.disabled = false; del.innerHTML = icon('trash') + 'Delete permanently'; }
    };

    // Cancel: new lead → close; existing lead → undo your changes
    $('[data-cancel]', root).onclick = () => {
      if (isNew) { closeTop(); return; }
      if (!dirty()) return;
      if (!confirm('Undo your changes to this lead?')) return;
      mount();
    };

    $('#fSave', root).onclick = async () => {
      if (st.pending) { toast('Wait for the photos to finish uploading'); return; }
      if (field(K.LSTATUS)) {
        if (isNotConv(st.vals[K.LSTATUS])) {
          if (!String(st.vals[K.REASON] || '').trim()) {
            const box = $('[data-reason]', root);
            if (box) { box.closest('.sec').classList.remove('closed'); $('[data-reason-err]', box).textContent = 'The reason is required when a lead is Not Converted.'; box.scrollIntoView({ block: 'center' }); $('textarea', box).focus(); }
            toast('Please enter why this lead was not converted', true); return;
          }
        } else if (st.vals[K.REASON]) st.vals[K.REASON] = '';
      }
      const missing = fields.filter(f => f.required && !(f.type === 'photos' ? st.photos[f.label].list.length : String(st.vals[f.label] || '').trim()));
      if (missing.length) { toast(`Please fill: ${missing.map(f => f.label).join(', ')}`, true); return; }
      const changes = {};
      fields.forEach(f => { if (f.type !== 'photos' && (st.vals[f.label] || '') !== (orig[f.label] || '')) changes[f.label] = st.vals[f.label]; });
      const photos = {};
      for (const [k, p] of Object.entries(st.photos)) if (p.added.length || p.removed.length) photos[k] = { added: p.added, removed: p.removed };
      if (isNew && !Object.values(changes).some(v => String(v).trim()) && !Object.keys(photos).length) { toast('Enter at least one detail before saving', true); return; }
      if (!isNew && !Object.keys(changes).length && !Object.keys(photos).length) { updateFoot(); return; }
      const b = $('#fSave', root); b.disabled = true; b.innerHTML = '<span class="spin"></span> Saving'; st.saving = true;
      try {
        const r = await api('saveLead', { sr: isNew ? null : sr, changes, photos });
        upsertLead(r.lead); if (r.fields) S.fields = r.fields; saveCache();
        if (isNew) { store.del('sl_draft'); closeTop(true); renderList(); toast(`Lead #${r.lead[K.SR]} saved`); }
        else { renderList(); mount(); toast('Changes saved'); }
      } catch (e) {
        st.saving = false; b.disabled = false; b.textContent = isNew ? 'Save lead' : 'Save changes'; toast(e.message, true);
      }
    };

    toggleReason(false);
    secCount(); markChanges(); updateFoot(); saveDraft();
  }

  mount(resume);
}

function fieldHTML(f, st, existing) {
  const id = 'f_' + Math.random().toString(36).slice(2, 8);
  const v = st.vals[f.label] || '';
  const lab = `<label class="l" for="${id}">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</label>`;
  const L = esc(f.label);
  const D = `data-f="${L}"`;
  const ph = 'Tap to add';
  switch (f.type) {
    case 'longtext':
      if (f.label === K.REASON) return `<div class="fld" ${D} data-reason><label class="l" for="${id}">Why not converted? <span class="req">*</span></label><textarea class="inp" id="${id}" data-in="${L}" rows="2" placeholder="e.g. Price too high, buying from another dealer, project on hold…">${esc(v)}</textarea><div class="hint err" data-reason-err aria-live="polite"></div></div>`;
      return `<div class="fld" ${D}>${lab}<textarea class="inp" id="${id}" data-in="${L}" rows="1" placeholder="${ph}">${esc(v)}</textarea></div>`;
    case 'phone': {
      const acts = existing && v ? `<a class="icon-btn call" href="${telLink(v)}" aria-label="Call ${L}">${icon('phone')}</a><a class="icon-btn call" href="${esc(waLink(v))}" target="_blank" rel="noopener" aria-label="WhatsApp ${L}">${icon('chat')}</a>` : '';
      return `<div class="fld" ${D}>${lab}<div class="inrow"><input class="inp" id="${id}" type="tel" inputmode="tel" autocomplete="off" data-in="${L}" value="${esc(v)}" placeholder="${ph}">${acts}</div><div class="hint warn" data-dup="${L}" aria-live="polite"></div></div>`;
    }
    case 'number': return `<div class="fld" ${D}>${lab}<input class="inp" id="${id}" inputmode="decimal" data-in="${L}" value="${esc(v)}" placeholder="${ph}"></div>`;
    case 'date': return `<div class="fld" ${D}>${lab}<input class="inp" id="${id}" type="date" data-in="${L}" value="${esc(v)}"></div>`;
    case 'multiselect': {
      const cur = multi(v);
      const opts = [...f.options, ...cur.filter(o => !f.options.includes(o))];
      return `<div class="fld" ${D}><span class="l" style="display:block;font-weight:600;margin-bottom:6px">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</span>
        <div class="opts" data-multi="${L}" role="group" aria-label="${L}">${opts.map(o => `<button type="button" class="opt" data-v="${esc(o)}" aria-pressed="${cur.includes(o)}">${cur.includes(o) ? '✓ ' : ''}${esc(o)}</button>`).join('')}</div></div>`;
    }
    case 'picklist': {
      const opts = f.options.includes(v) || !v ? f.options : [...f.options, v];
      return `<div class="fld" ${D}><span class="l" style="display:block;font-weight:600;margin-bottom:6px">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</span>
        <div class="opts" data-pick="${L}" role="group" aria-label="${L}">${opts.map(o => `<button type="button" class="opt ${f.label === K.LSTATUS ? statusClass(o) : ''}" data-v="${esc(o)}" aria-pressed="${o === v}">${esc(o)}</button>`).join('')}</div></div>`;
    }
    case 'picklist_custom': {
      const opts = f.options.includes(v) || !v ? f.options : [...f.options, v];
      return `<div class="fld" ${D}>${lab}<select class="inp" id="${id}" data-pc="${L}">
          <option value="">Choose…</option>${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}
          <option value="__new">＋ Add new…</option></select>
        <input class="inp hidden" style="margin-top:8px" data-pcnew="${L}" placeholder="Type the new ${esc(f.label.toLowerCase())}"></div>`;
    }
    case 'gps': return `<div class="fld" ${D}><span class="l" style="display:block;font-weight:600;margin-bottom:6px">${esc(f.label)}</span><div class="gps-box" data-gps="${L}"></div></div>`;
    case 'photos': return `<div class="fld" ${D}><span class="l" style="display:block;font-weight:600;margin-bottom:6px">${esc(f.label)}</span><div data-photos="${L}"></div></div>`;
    default: {
      const role = NAME_ROLE[f.label];
      if (role && field(K.CARDNAME)) {
        const on = cardRole(st.vals[K.CARDNAME]) === role;
        return `<div class="fld" ${D}>${lab}<div class="inrow"><input class="inp" id="${id}" data-in="${L}" value="${esc(v)}" autocomplete="off" placeholder="${ph}">
          <label class="onc ${on ? 'on' : ''}" title="Show this name on the card"><input type="checkbox" class="sw sm" data-oncard="${esc(role)}" ${on ? 'checked' : ''}><span>On card</span></label></div></div>`;
      }
      return `<div class="fld" ${D}>${lab}<input class="inp" id="${id}" data-in="${L}" value="${esc(v)}" autocomplete="off" placeholder="${ph}"></div>`;
    }
  }
}

function wireGPS(box, st, changed) {
  const lab = box.dataset.gps;
  let acc = null;
  const draw = () => {
    const v = st.vals[lab] || ''; const p = parseLatLng(v);
    box.innerHTML = `
      ${v ? `<div><div class="gps-val">${p ? `${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}` : esc(v)}</div>
        ${acc != null ? `<div class="hint ${acc > 50 ? 'warn' : ''}">Accurate to about ${Math.round(acc)} m${acc > 50 ? '. Step outside or wait a moment and capture again for a better fix.' : ''}</div>` : ''}</div>` : '<div class="hint" style="margin:0">Stand at the site and capture its location.</div>'}
      <div class="row2">
        <button type="button" class="btn ${v ? '' : 'primary'}" data-cap>${icon('pin')}${v ? 'Capture again' : 'Capture location'}</button>
        ${v ? `<a class="btn" href="${esc(mapsLink(v))}" target="_blank" rel="noopener">${icon('ext')}Open in Maps</a><button type="button" class="btn ghost danger" data-clr>Remove</button>` : ''}
      </div>
      <details><summary class="hint" style="cursor:pointer">Or paste a Google Maps link</summary>
        <input class="inp" style="margin-top:8px" data-paste placeholder="https://maps.google.com/…" value="${p ? '' : esc(v)}"></details>`;
    $('[data-cap]', box).onclick = capture;
    const c = $('[data-clr]', box); if (c) c.onclick = () => { st.vals[lab] = ''; acc = null; changed(); draw(); };
    $('[data-paste]', box).addEventListener('change', e => { st.vals[lab] = e.target.value.trim(); acc = null; changed(); draw(); });
  };
  const capture = () => {
    if (!('geolocation' in navigator)) { toast('This phone or browser cannot share location.', true); return; }
    const b = $('[data-cap]', box); b.disabled = true; b.innerHTML = '<span class="spin"></span> Finding location';
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      st.vals[lab] = `https://maps.google.com/?q=${latitude.toFixed(6)},${longitude.toFixed(6)}`;
      acc = accuracy; changed(); draw(); toast('Location captured');
    }, err => {
      draw();
      toast(err.code === 1 ? 'Location is blocked. Allow location for this app in your phone settings, then try again.'
        : err.code === 3 ? 'Location took too long. Turn on GPS and try again in the open.' : 'Could not get your location. Turn on GPS and try again.', true);
    }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
  };
  draw();
}

function wirePhotos(box, st, changed, root) {
  const lab = box.dataset.photos;
  const P = st.photos[lab];
  const local = {}; // id/tmp -> preview dataURL
  const tiles = []; // {key, state:'up'|'fail', data}
  // File pickers live outside the redrawn area, so a finishing upload can't remove them mid-pick
  const inputs = document.createElement('div');
  inputs.innerHTML = `<input type="file" accept="image/*" capture="environment" class="hidden" data-cam>
    <input type="file" accept="image/*" multiple class="hidden" data-pick>`;
  box.insertAdjacentElement('afterend', inputs);
  const camInput = $('[data-cam]', inputs), pickInput = $('[data-pick]', inputs);
  [camInput, pickInput].forEach(i => i.onchange = () => { [...i.files].forEach(add); i.value = ''; });
  const draw = () => {
    box.innerHTML = `<div class="photos">
      ${P.list.map(id => `<div class="ph"><img alt="" data-pid="${esc(id)}" data-open="${esc(id)}" style="cursor:zoom-in" src="${esc(local[id] || photoSrc(id, 300))}"><button type="button" class="x" data-rm="${esc(id)}" aria-label="Remove photo">${icon('x')}</button></div>`).join('')}
      ${tiles.map(t => `<div class="ph ${t.state === 'fail' ? 'fail' : ''}"><img alt="" src="${t.data}"><div class="state">${t.state === 'fail' ? '<button type="button" data-retry="' + t.key + '" style="all:unset;cursor:pointer">Failed. Tap to retry</button>' : 'Uploading…'}</div></div>`).join('')}
      <button type="button" class="add-ph" data-take>${icon('camera')}Take photo</button>
      <button type="button" class="add-ph" data-gal>${icon('image')}From gallery</button>
    </div>`;
    $('[data-take]', box).onclick = () => { changed(); openCamera(addData, () => camInput.click()); };
    $('[data-gal]', box).onclick = () => { changed(); pickInput.click(); };
    $$('[data-rm]', box).forEach(b => b.onclick = () => {
      if (!confirm('Remove this photo from the lead?')) return;
      const id = b.dataset.rm; P.list = P.list.filter(x => x !== id);
      if (P.added.includes(id)) P.added = P.added.filter(x => x !== id); else P.removed.push(id);
      changed(); draw();
    });
    $$('[data-retry]', box).forEach(b => b.onclick = () => { const t = tiles.find(x => x.key === b.dataset.retry); if (t) upload(t); });
    $$('[data-open]', box).forEach(im => im.onclick = () => openViewer(im.dataset.open));
    if (st.onPending) st.onPending(); // let the panel update its Save button
  };
  const upload = async t => {
    t.state = 'up'; st.pending++; draw();
    try {
      const { id } = await api('uploadPhoto', { data: t.data });
      local[id] = t.data; photoCache[id] = photoCache[id] || null;
      tiles.splice(tiles.indexOf(t), 1);
      P.list.push(id); P.added.push(id); changed();
    } catch (e) { t.state = 'fail'; toast(e.message, true); }
    st.pending--; draw();
  };
  const addData = data => { const t = { key: 't' + Math.random().toString(36).slice(2), state: 'up', data }; tiles.push(t); upload(t); };
  const add = async file => {
    try { addData(await compressFile(file)); }
    catch { toast('Could not read that photo. Try again.', true); }
  };
  draw();
}

/* ======================= ARRANGE (personal layout) ======================= */
// List columns: drag to reorder, switch to show/hide. Card layout: title, header labels, body.
// Saved for this person on this device; the Google Sheet is never changed.
function openArrange(startTab = 'cols') {
  let P = JSON.parse(JSON.stringify(prefs()));
  let cols = colsList(P);
  let tab = startTab;
  const L = openLayer({
    cls: 'drawer wide', head: drawerHead('Arrange', 'Your layout. It only changes how leads look for you; no data is changed.'),
    body: '', foot: `<button class="btn" type="button" data-reset>Reset to default</button><span class="grow"></span><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="button" data-save>Save</button>`
  });
  wireClose(L);
  const body = $('.panel-body', L.el);
  const textFields = () => F_().filter(f => ['text', 'longtext', 'phone', 'number', 'date', 'picklist', 'picklist_custom'].includes(f.type));
  const sample = () => visibleLeads()[0] || S.leads[0] || null;

  function draw() {
    const C = P.card;
    body.innerHTML = `
      <div class="tabs" role="tablist" style="margin-top:0">
        <button role="tab" data-t="cols" aria-selected="${tab === 'cols'}">List columns</button>
        <button role="tab" data-t="card" aria-selected="${tab === 'card'}">Card layout</button>
      </div>
      <div class="pane" ${tab === 'cols' ? '' : 'hidden'}>
        <p class="hint" style="margin:0 0 10px">Drag ${icon('grip')} to change the order. Switch off to hide a column from the list. To change a column's width, drag the edge of its title in the list.</p>
        <div class="arows" id="arows">
          <div class="arow fixed"><span class="hdl" aria-hidden="true" style="opacity:.3">${icon('grip')}</span><span class="nm">Sr. No.<small>Always first</small></span></div>
          ${cols.map((c, i) => `<div class="arow" data-k="${esc(c.key)}">
            <button class="hdl" type="button" aria-label="Move ${esc(colLabel(c.key))}. Use arrow keys.">${icon('grip')}</button>
            <span class="nm">${esc(colLabel(c.key))}<small>${c.key === '__name' ? 'Follows “Show name of”' : esc((field(c.key) || {}).section || 'Record info')} · ${c.w}px</small></span>
            <input type="checkbox" class="sw" data-show="${esc(c.key)}" ${c.show ? 'checked' : ''} aria-label="Show ${esc(colLabel(c.key))}">
          </div>`).join('')}
        </div>
      </div>
      <div class="pane" ${tab === 'card' ? '' : 'hidden'}>
        <div class="lay">
          <div>
            <h4 style="margin-top:0">Name shown big on the card</h4>
            <p class="hint" style="margin-top:0">Chosen inside each lead with the <b>On card</b> switch next to the Owner, Builder, Architect, Contractor or Electrical Contractor name. If nothing is chosen, the Builder is shown.</p>
            <h4>Line under the name</h4>
            <select class="inp" id="subSel"><option value="">Nothing</option>${textFields().map(f => `<option ${C.sub === f.label ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}</select>
            <h4>Labels on the top row</h4>
            ${sw('status', C.status, 'Lead Status')}${sw('type', C.type, 'Lead Type')}${sw('follow', C.follow, 'Follow-up date', 'Overdue / today / upcoming, for Open leads')}
            ${sw('project', C.project, 'Project', 'e.g. G+3')}${sw('ctype', C.ctype, 'Contractor Type', 'With / Without Material')}${sw('vendor', C.vendor, 'Vendor')}
            <h4>Card body</h4>
            ${sw('stage', C.stage, 'Site stage bar')}${sw('contacts', C.contacts, 'Contacts with call buttons')}
            ${sw('extras', C.extras, 'Other details', 'Fields the admin marked “Show on cards”')}${sw('foot', C.foot, 'Directions and photos')}
          </div>
          <div class="preview"><h4 style="margin-top:0">Preview</h4><div id="pv">${sample() ? cardHTML(sample(), P) : '<p class="hint">Add a lead to see a preview.</p>'}</div></div>
        </div>
      </div>`;
    $$('[data-t]', body).forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
    // columns
    $$('[data-show]', body).forEach(i => i.onchange = () => { cols.find(c => c.key === i.dataset.show).show = i.checked; });
    wireDrag();
    // card layout
    const pv = () => { const l = sample(); if (l) $('#pv', body).innerHTML = cardHTML(l, P); };
    const ss = $('#subSel', body); if (ss) ss.onchange = () => { P.card.sub = ss.value; pv(); };
    $$('[data-c]', body).forEach(i => i.onchange = () => { P.card[i.dataset.c] = i.checked; pv(); });
    $$('#pv a', body).forEach(a => a.addEventListener('click', e => e.preventDefault()));
  }
  function readOrder() {
    const order = $$('#arows .arow[data-k]', body).map(r => r.dataset.k);
    cols = order.map(k => cols.find(c => c.key === k));
  }
  function wireDrag() {
    const list = $('#arows', body); if (!list) return;
    $$('.arow[data-k] .hdl', list).forEach(h => {
      const row = h.closest('.arow');
      h.addEventListener('pointerdown', e => {
        e.preventDefault();
        row.classList.add('dragging');
        const mv = ev => {
          const others = $$('.arow[data-k]:not(.dragging)', list);
          const after = others.find(o => { const r = o.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
          if (after) list.insertBefore(row, after); else list.appendChild(row);
          const pb = $('.panel-body', L.el), r = pb.getBoundingClientRect();
          if (ev.clientY < r.top + 40) pb.scrollTop -= 12; else if (ev.clientY > r.bottom - 40) pb.scrollTop += 12;
        };
        // listen on the whole window: moving the row in the list would otherwise drop the drag
        const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); row.classList.remove('dragging'); readOrder(); };
        addEventListener('pointermove', mv);
        addEventListener('pointerup', up);
        addEventListener('pointercancel', up);
      });
      // keyboard: arrow keys move the column
      h.addEventListener('keydown', e => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const sib = e.key === 'ArrowUp' ? row.previousElementSibling : row.nextElementSibling;
        if (!sib || !sib.dataset.k) return;
        e.key === 'ArrowUp' ? list.insertBefore(row, sib) : list.insertBefore(sib, row);
        readOrder(); h.focus();
      });
    });
  }
  $('[data-reset]', L.el).onclick = () => {
    if (tab === 'cols') { P.cols = null; cols = colsList(P); }
    else { P.card = Object.assign({}, CARD_DEFAULTS); }
    draw();
  };
  $('[data-save]', L.el).onclick = () => {
    P.cols = cols.map(c => ({ key: c.key, show: c.show, w: c.w }));
    S.prefs = P; savePrefs();
    closeTop(true); renderList(); toast('Layout saved');
  };
  draw();
}

/* ======================= SETTINGS (columns) ======================= */
function openSettings() {
  const isAdmin = S.user && S.user.role === 'Admin';
  const L = openLayer({ cls: 'drawer', head: drawerHead('Columns and settings', 'Admin: the columns everyone sees in the form and the Google Sheet.'), body: '' });
  wireClose(L);
  let openRow = null;
  const draw = () => {
    const sections = [...new Set(S.fields.map(f => f.section))];
    $('.panel-body', L.el).innerHTML = `
      ${isAdmin ? `<section class="card-box"><h3>Add a new column</h3>
        <p class="hint" style="margin:0 0 12px">It appears straight away in the form, cards, list, search and Excel export for everyone, and a new column is added to your Google Sheet.</p>
        <form id="addCol" style="display:grid;gap:12px">
          <div class="fld"><label class="l" for="nc_l">Column name</label><input class="inp" id="nc_l" required maxlength="60" placeholder="e.g. Site Engineer Name"></div>
          <div class="fld"><label class="l" for="nc_t">Type</label><select class="inp" id="nc_t">${Object.entries(TYPE_NAMES).map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select></div>
          <div class="fld"><label class="l" for="nc_s">Section</label><input class="inp" id="nc_s" list="secList" placeholder="e.g. Site Engineer" value="Other"><datalist id="secList">${sections.map(s => `<option value="${esc(s)}">`).join('')}</datalist>
            <div class="hint">Pick an existing section or type a new one.</div></div>
          <div class="fld hidden" id="nc_ow"><label class="l" for="nc_o">Choices (one per line)</label><textarea class="inp" id="nc_o" rows="4"></textarea></div>
          <div class="checks"><label><input type="checkbox" id="nc_c"> Show on cards</label><label><input type="checkbox" id="nc_li" checked> Show in list</label><label><input type="checkbox" id="nc_r"> Required</label></div>
          <button class="btn primary" type="submit">${icon('plus')}Add column</button>
        </form></section>` : `<p class="banner" style="margin:0 0 12px">Only the admin can add or change columns. Ask Divyesh if you need a new one.</p>`}
      <section class="card-box"><h3>Your columns</h3>
        ${isAdmin ? '<p class="hint" style="margin:0 0 6px">Tap a column to change its section, choices or where it shows. Use the arrows to change the order.</p>' : ''}
        ${sections.map(sec => `<div class="f-group"><h4>${esc(sec)}</h4>${S.fields.filter(f => f.section === sec && f.label !== K.CARDNAME).map(f => fieldRow(f, isAdmin, openRow === f.label)).join('')}</div>`).join('')}
      </section>
      <section class="card-box"><h3>About</h3>
        <p class="hint" style="margin:0">Logged in as ${esc(S.user?.name || '')} (${esc(S.user?.role || '')}).<br>
        ${DEMO ? 'Demo mode: not connected to a Google Sheet yet.' : 'Connected to your Google Sheet.'}<br>App version ${APP_VERSION}${DEMO ? '' : ` · Google script version ${esc(S.backendVersion || '…')}`}</p>
        ${DEMO ? '<button class="btn" style="margin-top:12px" id="resetDemo">Reset demo data</button>' : ''}
      </section>`;
    const body = $('.panel-body', L.el);
    if (isAdmin) {
      const t = $('#nc_t', body), ow = $('#nc_ow', body);
      t.onchange = () => ow.classList.toggle('hidden', !hasChoices(t.value));
      $('#addCol', body).onsubmit = async e => {
        e.preventDefault();
        const fd = { label: $('#nc_l', body).value.trim(), type: t.value, section: $('#nc_s', body).value.trim() || 'Other',
          options: $('#nc_o', body).value.split(/\n|,/).map(s => s.trim()).filter(Boolean),
          card: $('#nc_c', body).checked, list: $('#nc_li', body).checked, required: $('#nc_r', body).checked };
        if ((fd.type === 'picklist' || fd.type === 'multiselect') && !fd.options.length) { toast('Add at least one choice for the picklist', true); return; }
        const b = e.submitter; b.disabled = true; b.innerHTML = '<span class="spin"></span> Adding';
        try { const r = await api('addField', { field: fd }); S.fields = r.fields; saveCache(); renderList(); toast(`Column "${fd.label}" added`); draw(); }
        catch (err) { toast(err.message, true); b.disabled = false; b.innerHTML = icon('plus') + 'Add column'; }
      };
    }
    $$('[data-frow]', body).forEach(r => r.onclick = e => { if (!isAdmin || e.target.closest('[data-mv]')) return; openRow = openRow === r.dataset.frow ? null : r.dataset.frow; draw(); });
    $$('[data-mv]', body).forEach(b => b.onclick = async () => {
      const labs = S.fields.map(f => f.label); const i = labs.indexOf(b.dataset.lab); const j = i + (+b.dataset.mv);
      if (j < 0 || j >= labs.length) return;
      [labs[i], labs[j]] = [labs[j], labs[i]];
      const byL = Object.fromEntries(S.fields.map(f => [f.label, f]));
      S.fields = labs.map(l => byL[l]); draw(); renderList();
      try { const r = await api('reorderFields', { labels: labs }); S.fields = r.fields; saveCache(); } catch (err) { toast(err.message, true); }
    });
    $$('form[data-fedit]', body).forEach(fm => fm.onsubmit = async e => {
      e.preventDefault();
      const lab = fm.dataset.fedit; const f = field(lab);
      const patch = { section: $('[name=sec]', fm).value.trim() || 'Other', card: $('[name=card]', fm).checked, list: $('[name=list]', fm).checked, required: $('[name=req]', fm).checked, active: !$('[name=hide]', fm).checked };
      if (hasChoices(f.type)) patch.options = $('[name=opts]', fm).value.split('\n').map(s => s.trim()).filter(Boolean);
      const mx = $('[name=multi]', fm); if (mx) patch.type = mx.checked ? 'multiselect' : 'picklist';
      const b = e.submitter; b.disabled = true;
      try { const r = await api('updateField', { label: lab, patch }); S.fields = r.fields; saveCache(); renderList(); openRow = null; draw(); toast('Column updated'); }
      catch (err) { toast(err.message, true); b.disabled = false; }
    });
    const rd = $('#resetDemo', body);
    if (rd) rd.onclick = () => { if (confirm('Reset all demo data on this device?')) { store.del('sl_demo5'); store.del('sl_draft'); refresh(true); closeTop(true); } };
  };
  draw();
}
function fieldRow(f, isAdmin, open) {
  const where = [f.card && 'cards', f.list && 'list'].filter(Boolean).join(' and ');
  return `<div class="f-row ${f.active ? '' : 'off'}">
    <div class="f-main" data-frow="${esc(f.label)}" ${isAdmin ? 'style="cursor:pointer" role="button" tabindex="0"' : ''}>
      <div class="nm"><b>${esc(f.label)}</b><small>${esc(TYPE_NAMES[f.type] || f.type)}${f.active ? (where ? `, shows in ${where}` : ', form only') : ', hidden'}${f.required ? ', required' : ''}</small></div>
      ${isAdmin ? `<button class="icon-btn" data-mv="-1" data-lab="${esc(f.label)}">${icon('up', 'Move up')}</button><button class="icon-btn" data-mv="1" data-lab="${esc(f.label)}">${icon('down', 'Move down')}</button>` : ''}
    </div>
    ${open ? `<form class="f-edit" data-fedit="${esc(f.label)}">
      <div class="fld"><label class="l">Section</label><input class="inp" name="sec" list="secList2" value="${esc(f.section)}"><datalist id="secList2">${[...new Set(S.fields.map(x => x.section))].map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
      ${hasChoices(f.type) ? `<div class="fld"><label class="l">Choices (one per line)</label><textarea class="inp" name="opts" rows="5">${esc(f.options.join('\n'))}</textarea></div>` : ''}
      ${f.type === 'picklist' || f.type === 'multiselect' ? `<div class="checks"><label><input type="checkbox" name="multi" ${f.type === 'multiselect' ? 'checked' : ''}> Allow more than one choice</label></div>` : ''}
      <div class="checks">
        <label><input type="checkbox" name="card" ${f.card ? 'checked' : ''}> Show on cards</label>
        <label><input type="checkbox" name="list" ${f.list ? 'checked' : ''}> Show in list</label>
        <label><input type="checkbox" name="req" ${f.required ? 'checked' : ''}> Required</label>
        <label><input type="checkbox" name="hide" ${f.active ? '' : 'checked'}> Hide this column</label>
      </div>
      <p class="hint" style="margin:0">Hiding keeps all existing data in the sheet; it just stops showing in the app.</p>
      <button class="btn primary" type="submit">Save column</button>
    </form>` : ''}
  </div>`;
}

/* ======================= START ======================= */
(function start() {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  history.replaceState({ layer: 0 }, '');
  if (!S.auth) { renderLogin(); return; }
  const c = store.get('sl_cache');
  if (c && c.fields) {
    S.user = c.user; S.fields = c.fields; S.leads = c.leads || []; S.loadedAt = c.at || 0; renderMain(); refresh(true);
    const of = store.get('sl_open_form');
    if (of && Date.now() - (of.at || 0) < 12 * 3600e3 && (!of.sr || S.leads.some(l => l[K.SR] === of.sr))) setTimeout(() => openForm(of.sr, of), 150);
    else store.del('sl_open_form');
  }
  else { renderMain(); $('#list').innerHTML = '<div class="loading"><span class="spin"></span> Loading leads</div>'; refresh(true); }
})();
</script>
